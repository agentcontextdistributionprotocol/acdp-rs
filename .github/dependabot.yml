version: 2
updates:
  # Root cargo workspace (umbrella acdp + crates/*).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Crypto-critical direct deps (#322). Listed FIRST so it matches before
      # the generic groups: a bump here needs a real cargo-vet audit (the
      # crypto-critical guard in ci.yml fails on an exemption), so keep it
      # in its own reviewable PR. Direct deps only: ed25519-dalek, p256,
      # sha2, zeroize (crates/acdp-crypto/Cargo.toml) and rustls (a direct
      # [dev-dependencies] entry in Cargo.toml; the production rustls via
      # reqwest is the same lock entry). Widening `allow` to
      # `dependency-type: all` is per ecosystem entry, not per group, and
      # would open lockfile PRs for the whole transitive graph; the
      # transitive crypto crates (curve25519-dalek, signature, ecdsa,
      # elliptic-curve, subtle, ring) move only with a lock rewrite, which
      # the guard catches. See scripts/crypto-critical.txt and
      # docs/supply-chain.md "Upgrading a crypto-critical crate".
      crypto:
        patterns:
          - "ed25519-dalek"
          - "p256"
          - "sha2"
          - "zeroize"
          - "rustls"
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # The language bindings are standalone [workspace]s (own Cargo.toml,
  # own lockfile), so the root cargo updater does not see their direct
  # third-party deps (pyo3, napi, wasm-bindgen). Watch each separately.
  - package-ecosystem: cargo
    directory: "/bindings/acdp-py"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: cargo
    directory: "/bindings/acdp-node"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: cargo
    directory: "/bindings/acdp-wasm"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # getrandom majors are bumped by hand here. The binding now has one
      # major, 0.4 (the `getrandom_wasm` alias, `wasm_js` feature), shared
      # with acdp-crypto's SysRng and uuid v4; the old direct 0.2 (`js`)
      # dependency was removed in #363. getrandom renames its wasm backend
      # feature across majors (`js` -> `wasm_js`; a major bump of the old
      # 0.2 pin broke the wasm build in PR #122), and the binding's major
      # must move with the root workspace's acdp-crypto pin anyway
      # (scripts/check-bindings-lock-parity.sh), so a Dependabot major PR
      # against this directory alone is never the right change.
      #
      # This rule alone does not retroactively cancel an in-flight
      # Dependabot run: #133's run started before this ignore rule merged
      # and created the PR ~3 minutes after (20:13Z vs. this rule's 20:09Z
      # merge) — config is read at run start, so an already-running scan
      # isn't re-evaluated against it. #133 then auto-merged minutes later
      # DESPITE its own acdp-wasm CI check showing FAILURE 28 seconds
      # before the merge — that's the real gap (auto-merge not gating on
      # every bindings.yml job), not a flaw in this ignore rule itself.
      - dependency-name: getrandom
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  # Node binding's npm dev toolchain (@napi-rs/cli).
  - package-ecosystem: npm
    directory: "/bindings/acdp-node"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to an exact version and asserted by a guard step in
      # bindings.yml / bindings-release.yml; bump deliberately, together
      # with those guards (see ASSUMPTIONS.md, #240).
      - dependency-name: "@napi-rs/cli"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]
