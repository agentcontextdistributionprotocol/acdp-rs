name: acdp-py-release

# Publishes the `acdp` Python SDK (abi3 wheels) to PyPI.
#
# Trigger: either push a tag of the form `acdp-py-v0.3.0`, or a
# `workflow_dispatch` — the latter is how `release-plz.yml`'s SDK cascade
# fires this workflow automatically whenever the core `acdp` crate
# releases (see release-plz.yml's "Release SDK bindings at the acdp
# version" step). The build matrix cross-builds one cp39-abi3 wheel per
# OS/arch (matching the Node SDK's platform set) plus a source
# distribution; the publish job uploads them all to PyPI in one shot.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — NO API token or secret.
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   - PyPI project name: acdp
#   - Owner:       agentcontextdistributionprotocol
#   - Repository:  acdp-rs
#   - Workflow:    acdp-py-release.yml
#   - Environment: pypi
# To use an API token instead, drop the `id-token`/`environment` lines and
# set `MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}` on the publish step.
#
# NOTE: the tag version must match `version` in both bindings/acdp-py/
# pyproject.toml and bindings/acdp-py/Cargo.toml.

on:
  push:
    tags:
      - 'acdp-py-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to stamp + publish (e.g. 0.8.0). Empty = use the manifest version.'
        type: string
        default: ''
      dry_run:
        description: 'Build only; skip PyPI publish'
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # OIDC for build provenance attestation
      attestations: write # write the SLSA provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
    steps:
      - uses: actions/checkout@v7
      # Gate the THIRD-PARTY dependency graph against the committed
      # Cargo.lock *before* the version stamp below touches Cargo.toml /
      # pyproject.toml. Must run pre-stamp: maturin's own `--locked` flag
      # would, like napi, choke on the harmless stamped-Cargo.toml-vs-
      # committed-Cargo.lock version mismatch rather than catching real
      # third-party drift — same reasoning as acdp-wasm-release.yml's and
      # bindings-release.yml's identical pre-stamp gates. So this repo
      # checks here, against the still-original manifest, instead of
      # passing `--locked` to the maturin-action build below.
      - name: Verify committed lockfile is up to date (--locked)
        working-directory: bindings/acdp-py
        run: cargo metadata --locked --format-version 1 > /dev/null
      # Stamp the release version (from the dispatch input, or the tag on a
      # tag-push) into the manifests so the published wheel version matches
      # the acdp release. Portable sed (anchored ^version → package line only).
      - name: Stamp release version
        working-directory: bindings/acdp-py
        run: |
          V="${{ inputs.version }}"; [ -z "$V" ] && V="${GITHUB_REF_NAME#acdp-py-v}"
          echo "stamping version $V"
          sed -i.bak -E "s/^version[[:space:]]*=.*/version = \"$V\"/" pyproject.toml Cargo.toml && rm -f pyproject.toml.bak Cargo.toml.bak
      # maturin-action picks up `abi3-py39` from Cargo.toml and emits a
      # single cp39-abi3 wheel per target; `manylinux: auto` builds the
      # Linux wheels in a manylinux container (and cross-compiles aarch64).
      # No --locked here — see the gate step above for why.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/acdp-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      # Attest the wheel before it leaves this job (SLSA build provenance,
      # verifiable with `gh attestation verify <wheel> --repo <owner>/acdp-rs`).
      # This is independent of the PEP 740 attestation the publish job uploads
      # to PyPI — belt and suspenders.
      - name: Attest build provenance (wheel)
        uses: actions/attest-build-provenance@v4 # first-party, major tag
        with:
          subject-path: bindings/acdp-py/dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/acdp-py/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for build provenance attestation
      attestations: write # write the SLSA provenance attestation
    steps:
      - uses: actions/checkout@v7
      # See the `wheels` job's identical pre-stamp gate for why this runs
      # here (before the version stamp) rather than as a `--locked` flag on
      # the maturin-action step below.
      - name: Verify committed lockfile is up to date (--locked)
        working-directory: bindings/acdp-py
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Stamp release version
        working-directory: bindings/acdp-py
        run: |
          V="${{ inputs.version }}"; [ -z "$V" ] && V="${GITHUB_REF_NAME#acdp-py-v}"
          echo "stamping version $V"
          sed -i.bak -E "s/^version[[:space:]]*=.*/version = \"$V\"/" pyproject.toml Cargo.toml && rm -f pyproject.toml.bak Cargo.toml.bak
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/acdp-py
          command: sdist
          args: --out dist
      - name: Attest build provenance (sdist)
        uses: actions/attest-build-provenance@v4 # first-party, major tag
        with:
          subject-path: bindings/acdp-py/dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: bindings/acdp-py/dist/*.tar.gz
          if-no-files-found: error

  smoke:
    name: smoke (golden vector)
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    steps:
      - uses: actions/checkout@v7
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Install the built wheel matching this runner (x86_64 manylinux);
      # pip resolves the compatible one from the built set. Then reproduce
      # the sig-001 golden vector — a broken wheel fails before publish.
      # (The cross-compiled aarch64/darwin wheels can't run here; they're
      # covered by provenance + the per-PR bindings.yml suite.)
      - name: Install the built wheel + run smoke
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links dist --only-binary :all: acdp
          python bindings/acdp-py/scripts/smoke.py

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels, sdist, smoke]
    # Skip on a dry-run workflow_dispatch; always publish on a tag push.
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    environment: pypi
    permissions:
      contents: write # push the release tag
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - name: Download all wheels + sdist
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List what will be published
        run: ls -la dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.0)
        with:
          packages-dir: dist
          # PEP 740 attestations: the action mints a digital attestation for
          # each uploaded file from this run's OIDC id-token and uploads it to
          # PyPI. Default-on when id-token: write is present; set explicitly so
          # the guarantee is visible and cannot silently regress. Viewable on
          # the PyPI release page and via the integrity API.
          attestations: true

      # Only a workflow_dispatch publish needs a tag created here — a tag
      # push already has the tag, and a dry_run never actually published.
      - name: Tag the release
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          V: ${{ inputs.version }}
        run: |
          # This step only ever runs on workflow_dispatch (see the `if:` above) — on
          # that trigger GITHUB_REF_NAME is the dispatched ref (e.g. "main"), never a
          # tag name, so there is no sane fallback to derive a version from it. Fail
          # fast instead of tagging something like "acdp-py-vmain".
          if [ -z "$V" ]; then echo "::error::version input is required to tag a release" >&2; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "acdp-py-v${V}" -m "acdp-py v${V}"
          git push origin "acdp-py-v${V}"

      # Notify the Python consumer (acdp-playground) so it opens an auto-bump PR
      # via acdp-ci's bump-consume. App-authenticated (org secrets) — no PAT.
      #
      # Deliberately no `if:` of its own on either step below: the containing `publish`
      # job already carries a job-level gate (`if:` above, `:180`) that restricts the
      # whole job — including these two steps — to a real tag push or a non-dry-run
      # workflow_dispatch. Adding a per-step `if: github.event_name == 'push'` (the
      # original bug — issue #304) re-narrowed that back down to tag-push only, which is
      # never true on the release-plz cascade. These steps now inherit the job-level gate
      # plus the default implicit success() requirement over every step before them
      # (including "Tag the release", now that they're ordered after it) — exactly how
      # "Publish to PyPI" above already behaves with no extra gate of its own. See
      # plans/issues-302-304-release-dispatch-fix.md Phase 2 for the full reasoning,
      # including why this file does not need bindings-release.yml's
      # `steps.<id>.outcome`-anchored predicate (no equivalent always()-gated recovery
      # step exists in this job).
      - name: Mint token for acdp-playground
        id: dispatch-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACDP_BOT_APP_ID }}
          private-key: ${{ secrets.ACDP_BOT_PRIVATE_KEY }}
          owner: agentcontextdistributionprotocol
          repositories: acdp-playground
      - name: Dispatch acdp-released (uv)
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          REF: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Prefer the dispatch input (always set, to a real resolved version, on the
          # release-plz workflow_dispatch cascade — see release-plz.yml's "Release SDK
          # bindings at the acdp version" step); fall back to the ref-derived tag suffix
          # for a plain tag push, where `inputs.version` is unset. On workflow_dispatch,
          # github.ref_name is the dispatched ref (e.g. "main"), never a version — the
          # guard below exists specifically to catch that and fail loudly instead of
          # dispatching {"version":"main"}.
          if [ -n "${INPUT_VERSION}" ]; then
            VER="${INPUT_VERSION}"
          else
            VER="${REF#acdp-py-v}"
          fi
          # Accepts anything shaped like <digits>.<digits>.<digits>[...] — a prefix
          # check, not full semver validation. Sufficient here: it only needs to reject
          # the one reachable non-version value (a bare ref name like "main" or an empty
          # string), and VER is only ever passed through `jq --arg`, never
          # shell-interpolated into a command.
          case "$VER" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to dispatch acdp-released with version '$VER'" >&2; exit 1 ;;
          esac
          jq -nc --arg v "$VER" --arg e uv '{event_type:"acdp-released",client_payload:{version:$v,ecosystem:$e}}' \
            | gh api repos/agentcontextdistributionprotocol/acdp-playground/dispatches --method POST --input -
