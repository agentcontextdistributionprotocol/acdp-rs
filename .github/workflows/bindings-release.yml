name: bindings-release

# Publishes the `acdp` Node.js SDK (NAPI prebuilts) to npm.
#
# Trigger: either push a tag of the form `acdp-node-v0.3.0`, or a
# `workflow_dispatch` — the latter is how `release-plz.yml`'s SDK cascade
# fires this workflow automatically whenever the core `acdp` crate
# releases (see release-plz.yml's "Release SDK bindings at the acdp
# version" step). The job matrix cross-builds the native `.node` for
# every target in `bindings/acdp-node/package.json`'s `napi.triples`,
# then a single publish job assembles the per-platform npm packages
# (`acdp-darwin-arm64`, `acdp-linux-x64-gnu`, …) plus the loader package
# (`acdp`) via `napi prepublish` and `npm publish`.
#
# Requires repo secret `NPM_TOKEN` (an npm automation token with publish
# rights to `acdp` and the `acdp-*` platform packages).

on:
  push:
    tags:
      - 'acdp-node-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to stamp + publish (e.g. 0.8.0). Empty = use the manifest version.'
        type: string
        default: ''
      dry_run:
        description: 'Build only; skip npm publish'
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: bindings/acdp-node

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read
      id-token: write # OIDC for build provenance attestation
      attestations: write # write the SLSA provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            host: macos-latest
          - target: aarch64-apple-darwin
            host: macos-latest
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-latest
            # Cross-compiled with zig so we don't need an arm64 runner.
            zig: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          workspaces: bindings/acdp-node
      - name: Install zig (cross targets)
        if: ${{ matrix.zig }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      # `npm ci`, not `npm install`: this step runs *before* the version
      # stamp below touches package.json, so the manifest here still
      # matches the committed lockfile and `npm ci` can enforce that (#249).
      # Do NOT move this after the stamp — see the publish job's identical
      # install step for what happens then.
      - name: Install dependencies
        run: npm ci
      # The committed lockfile pins the toolchain; this asserts the pin
      # actually held.
      - name: Assert the pinned @napi-rs/cli version
        working-directory: bindings/acdp-node
        run: node -e 'if(require("./node_modules/@napi-rs/cli/package.json").version!=="3.8.6")process.exit(1)'
      # Gate the THIRD-PARTY dependency graph against the committed
      # Cargo.lock *before* the version stamp below touches Cargo.toml.
      # This must run pre-stamp, not post-stamp, for the same reason as
      # acdp-wasm-release.yml's identical gate: a `--locked` check placed
      # *after* the stamp would spuriously fail every release. It's worse
      # here than for wasm-pack, though — napi build DOES forward --locked
      # straight through to its own `cargo metadata` call (unlike
      # wasm-pack, which repairs the lock via an unlocked `cargo metadata`
      # before ever seeing --locked), so a post-stamp --locked on the `npx
      # napi build` lines below would fail on the harmless stamped-Cargo.toml
      # -vs-committed-Cargo.lock version mismatch, not on real drift. Do
      # NOT add --locked to those lines; this pre-stamp check against the
      # still-original manifest is the real gate.
      - name: Verify committed lockfile is up to date (--locked)
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Stamp release version
        run: |
          V="${{ inputs.version }}"; [ -z "$V" ] && V="${GITHUB_REF_NAME#acdp-node-v}"
          echo "stamping version $V"
          jq --arg v "$V" '.version=$v' package.json > package.json.tmp && mv package.json.tmp package.json
          sed -i.bak -E "s/^version[[:space:]]*=.*/version = \"$V\"/" Cargo.toml && rm -f Cargo.toml.bak
      # No --locked here: napi build forwards it to `cargo metadata`, which
      # would then choke on the version this job just stamped into
      # Cargo.toml not matching the committed Cargo.lock — see the gate
      # step above, which is what actually proves the resolved graph is
      # frozen.
      - name: Build (native)
        if: ${{ !matrix.zig }}
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - name: Build (zig cross)
        if: ${{ matrix.zig }}
        run: npx napi build --platform --release --target ${{ matrix.target }} --cross-compile
      # Golden-vector smoke on the one leg whose .node runs natively on its
      # host (x86_64 linux on ubuntu). index.js loads the local .node, so
      # this exercises the exact binary about to be published. The darwin
      # and cross-compiled aarch64 .node files can't execute on their build
      # hosts, so they're covered by the release-time provenance + the
      # per-PR bindings.yml suite instead.
      - name: Smoke test (sig-001 golden vector)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: node scripts/smoke.mjs
      # Attest the freshly-built native binary BEFORE it leaves this job.
      # Produces a signed SLSA build-provenance statement (stored via the
      # GitHub attestations API) binding this .node's sha256 to this repo,
      # workflow, and commit. Consumers verify with:
      #   gh attestation verify <file.node> --repo <owner>/acdp-rs
      # subject-path is resolved from GITHUB_WORKSPACE (uses: steps ignore
      # the job-level defaults.run.working-directory).
      - name: Attest build provenance (.node)
        uses: actions/attest-build-provenance@v4 # first-party, major tag
        with:
          subject-path: bindings/acdp-node/*.node
      - name: Upload .node artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/acdp-node/*.node
          if-no-files-found: error

  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # push the release tag
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # The published npm version (root loader + per-platform packages) is
      # read from package.json here, so stamp it in this job too.
      - name: Stamp release version
        run: |
          V="${{ inputs.version }}"; [ -z "$V" ] && V="${GITHUB_REF_NAME#acdp-node-v}"
          echo "stamping version $V"
          jq --arg v "$V" '.version=$v' package.json > package.json.tmp && mv package.json.tmp package.json
      # Deliberately still `npm install`, not `npm ci` (#249). #249 removed
      # the self-referential `optionalDependencies` block that used to pin
      # the four platform packages to package.json's own version — that was
      # the actual source of the old lock/manifest disagreement here, since
      # the stamp above changes that version *before* this step and nothing
      # republishes the lockfile in between. With that block gone, spot
      # checks suggest `npm ci` may now tolerate a plain version-field stamp
      # (it appears to validate only dependency specifiers against the
      # lock, not the root package's own name/version), but this is the one
      # job that gates real releases and the only path where a wrong call
      # has a production cost, so don't bet that invariant here. `npm
      # install` still authoritatively reads the committed lockfile (see the
      # bindings-npm-audit job in bindings.yml) and needs no such assumption.
      - name: Install dependencies
        run: npm install
      # The committed lockfile pins the toolchain; this asserts the pin
      # actually held.
      - name: Assert the pinned @napi-rs/cli version
        working-directory: bindings/acdp-node
        run: node -e 'if(require("./node_modules/@napi-rs/cli/package.json").version!=="3.8.6")process.exit(1)'
      - name: Download all .node artifacts
        uses: actions/download-artifact@v8
        with:
          path: bindings/acdp-node/artifacts
          pattern: bindings-*
          merge-multiple: true
      - name: Scaffold per-platform npm package dirs
        run: npx napi create-npm-dirs
      - name: Assemble per-platform npm dirs
        run: npx napi artifacts --output-dir artifacts
      - name: List what will be published
        run: ls -R npm && ls -la *.node 2>/dev/null || true
      # `napi pre-publish` only publishes the per-platform binary packages
      # (acdp-darwin-arm64, …). It does NOT publish the root loader package
      # (@agentcontextdistributionprotocol/acdp) — that has to be published
      # with `npm publish`. We do both, as two steps. `--gh-release` defaults
      # to true in napi-cli 3.x (unlike the removed `--skip-gh-release`'s
      # implication) and fails outright here since our tags aren't paired
      # with a matching "release commit" napi-cli can find — pass
      # `--no-gh-release` to keep the old skip-gh-release behavior.
      - name: Publish platform packages
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npx napi pre-publish --npm-dir npm --no-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      # `if: always()` so that re-running a partially-completed release (where
      # the platform packages already exist and the step above errors with
      # "cannot publish over existing version") still publishes the root.
      # `--ignore-scripts` stops npm from re-running the `prepublishOnly` hook
      # (which is `napi prepublish`) and republishing the platform packages.
      - name: Publish root loader package
        id: publish-root
        if: ${{ always() && (github.event_name == 'push' || !inputs.dry_run) }}
        # --provenance publishes a signed npm provenance statement generated
        # from this run's OIDC id-token (job perm `id-token: write`). Requires
        # npm >= 9.5; setup-node's Node 20 ships npm >= 10. NPM_CONFIG_PROVENANCE
        # is kept for `napi prepublish` (the platform-package step), which has
        # no --provenance flag of its own and reads the env var instead.
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Only a workflow_dispatch publish needs a tag created here — a tag
      # push already has the tag, and a dry_run never actually published.
      - name: Tag the release
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          V: ${{ inputs.version }}
        run: |
          # This step only ever runs on workflow_dispatch (see the `if:` above) — on
          # that trigger GITHUB_REF_NAME is the dispatched ref (e.g. "main"), never a
          # tag name, so there is no sane fallback to derive a version from it. Fail
          # fast instead of tagging something like "acdp-node-vmain".
          if [ -z "$V" ]; then echo "::error::version input is required to tag a release" >&2; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "acdp-node-v${V}" -m "acdp-node v${V}"
          git push origin "acdp-node-v${V}"

      # Notify the npm consumer (acdp-control-plane) so it opens an auto-bump PR
      # via acdp-ci's bump-consume. App-authenticated (org secrets) — no PAT.
      #
      # `always() && steps.publish-root.outcome == 'success'` — deliberately NOT a bare
      # `always()` (would fire even if "Publish root loader package" itself genuinely
      # failed) and NOT the plain implicit success() a bare `if:` would carry (would
      # skip this on the documented "Publish platform packages" already-published
      # idempotent-retry recovery, since success() scans every prior step in the job,
      # not just the one immediately before it — see plans/issues-302-304-release-
      # dispatch-fix.md Phase 1 for the full reasoning). Anchoring on the root-publish
      # step's own recorded outcome is what actually means "the release shipped".
      # Ordered after "Tag the release" so the tag a bump PR might reference already
      # exists by the time the consumer reacts; this step's own gate does not depend on
      # "Tag the release" succeeding (see the plan's Edge cases for why that's correct).
      - name: Mint token for acdp-control-plane
        id: dispatch-token
        if: ${{ always() && steps.publish-root.outcome == 'success' && (github.event_name == 'push' || !inputs.dry_run) }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACDP_BOT_APP_ID }}
          private-key: ${{ secrets.ACDP_BOT_PRIVATE_KEY }}
          owner: agentcontextdistributionprotocol
          repositories: acdp-control-plane
      - name: Dispatch acdp-released (npm)
        if: ${{ always() && steps.publish-root.outcome == 'success' && (github.event_name == 'push' || !inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          REF: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Prefer the dispatch input (always set, to a real resolved version, on the
          # release-plz workflow_dispatch cascade — see release-plz.yml's "Release SDK
          # bindings at the acdp version" step); fall back to the ref-derived tag suffix
          # for a plain tag push, where `inputs.version` is unset. On workflow_dispatch,
          # github.ref_name is the dispatched ref (e.g. "main"), never a version — the
          # guard below exists specifically to catch that and fail loudly instead of
          # dispatching {"version":"main"}.
          if [ -n "${INPUT_VERSION}" ]; then
            VER="${INPUT_VERSION}"
          else
            VER="${REF#acdp-node-v}"
          fi
          # Accepts anything shaped like <digits>.<digits>.<digits>[...] — a prefix
          # check, not full semver validation (e.g. a trailing garbage suffix would
          # still pass). That's sufficient here: it only needs to reject the one
          # reachable non-version value (a bare ref name like "main" or an empty
          # string), and VER is only ever passed through `jq --arg`, never
          # shell-interpolated into a command.
          case "$VER" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to dispatch acdp-released with version '$VER'" >&2; exit 1 ;;
          esac
          jq -nc --arg v "$VER" --arg e npm '{event_type:"acdp-released",client_payload:{version:$v,ecosystem:$e}}' \
            | gh api repos/agentcontextdistributionprotocol/acdp-control-plane/dispatches --method POST --input -
