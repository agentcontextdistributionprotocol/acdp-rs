name: bindings

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'bindings/**'
      - '.github/workflows/bindings.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'bindings/**'
      - '.github/workflows/bindings.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bindings-fmt:
    name: rustfmt (bindings)
    runs-on: ubuntu-latest
    # Each binding crate is a standalone Cargo package with its own
    # [workspace] table, so the root `cargo fmt --all -- --check` (ci.yml's
    # `fmt` job) never walks into bindings/**/src/ — that job only sees
    # whatever `[workspace] members` the root Cargo.toml lists, and the
    # bindings are deliberately excluded from it. Without this job the
    # bindings have no rustfmt check anywhere in CI.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --manifest-path bindings/acdp-py/Cargo.toml -- --check
      - run: cargo fmt --all --manifest-path bindings/acdp-node/Cargo.toml -- --check
      - run: cargo fmt --all --manifest-path bindings/acdp-wasm/Cargo.toml -- --check

  acdp-py:
    name: acdp-py (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          # Standalone [workspace] in each binding's Cargo.toml, so a
          # separate cache key keeps the bindings' target/ dirs from
          # competing with the root crate's.
          workspaces: bindings/acdp-py
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # `maturin develop` requires an active venv/conda env — it refuses
      # to install into the bare hosted-tool Python. Create one and
      # promote it into PATH + VIRTUAL_ENV for every subsequent step.
      - name: Create and activate venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install maturin + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin==1.15.0' 'pytest==8.4.2'
      # The pins above are declared, not enforced, by pip alone (a stale
      # cache or an index anomaly could still hand back something else);
      # assert the resolved versions the same way bindings.yml's
      # `Assert the pinned @napi-rs/cli version` step does for npm.
      # pytest==8.4.2 (not the newer 9.x also seen in this fleet) is the
      # one version that installs on every leg of this job's python
      # matrix — pytest>=9 requires Python>=3.10 and this matrix includes
      # 3.9.
      - name: Assert the pinned maturin + pytest versions
        run: |
          python -c 'import importlib.metadata as m, sys; sys.exit(0 if m.version("maturin") == "1.15.0" else 1)'
          python -c 'import importlib.metadata as m, sys; sys.exit(0 if m.version("pytest") == "8.4.2" else 1)'
      - name: Build the wheel (editable)
        working-directory: bindings/acdp-py
        run: maturin develop --release --locked
      - name: pytest
        working-directory: bindings/acdp-py
        run: pytest tests/ -v

  acdp-node:
    name: acdp-node (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 (LTS), 22 (LTS) — 22 catches `node --test tests/`
        # regressions where bare dir paths started failing with
        # MODULE_NOT_FOUND. 18 dropped: `@napi-rs/cli` 3.x's
        # `@inquirer/core` dependency imports `node:util`'s
        # `styleText`, added in Node 20.17/22.13+ and absent in 18
        # (already EOL since 2025-04) — `napi build` can no longer
        # run there at all. `engines.node` in package.json matches.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          workspaces: bindings/acdp-node
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install @napi-rs/cli
        working-directory: bindings/acdp-node
        run: npm install
      - name: Assert the pinned @napi-rs/cli version
        working-directory: bindings/acdp-node      # REQUIRED — `working-directory` is per-step,
                                                    # and `node -e` resolves require() against cwd
        run: node -e 'if(require("./node_modules/@napi-rs/cli/package.json").version!=="3.8.6")process.exit(1)'
      - name: Build the native binary
        working-directory: bindings/acdp-node
        # `napi build` (which this script wraps) has no documented --locked
        # flag; it does accept arbitrary trailing cargo options via a
        # Clipanion "rest" argument, but only once it sees its own `--`
        # separator (Clipanion routes anything after `--` straight through,
        # not merely any unrecognized flag). `npm run <script> -- X` appends
        # X directly after the script's own argv with no separator of its
        # own, so getting one `--` in front of `--locked` on the far side
        # requires passing TWO here: `-- --` is npm's separator (stop
        # parsing npm's own flags) followed by the literal `--` napi needs,
        # then `--locked`. Verified locally: this makes `napi build
        # --platform --locked` reach cargo (and correctly fails a build
        # against a deliberately stale lockfile) — a bare `-- --locked`
        # (single `--`) is rejected by napi's CLI parser as an unknown
        # option before it ever reaches cargo.
        run: npm run build:debug -- -- --locked
      # index.js + index.d.ts are napi-generated but git-tracked (see
      # .gitignore's acdp-node section): the bindings-release publish job
      # does not run `napi build`, so whatever is committed here is exactly
      # what ships to npm. Nothing else in CI checks that the committed
      # copies match what the current source actually generates, so a
      # contributor who edits the Rust FFI surface without regenerating
      # them would ship a stale loader/type-defs pair silently. Fail if
      # `npm run build:debug` (just run above) produced a diff against the
      # committed files.
      - name: Fail if generated NAPI artifacts are stale
        working-directory: bindings/acdp-node
        run: |
          if ! git diff --exit-code -- index.js index.d.ts; then
            echo "::error::bindings/acdp-node/index.js and/or index.d.ts are out of date." \
                 "Run 'npm run build:debug' in bindings/acdp-node and commit the result."
            exit 1
          fi
      - name: node --test
        working-directory: bindings/acdp-node
        # Explicit glob: Node 22+ treats `--test tests/` as a module
        # path (MODULE_NOT_FOUND) instead of recursing into the dir.
        run: node --test tests/*.mjs

  acdp-wasm:
    name: acdp-wasm (wasm32 verifier core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The golden-parity test (sig-001 + wit-001) reads the canonical
      # spec fixtures; check them out so ACDP_REQUIRE_CONFORMANCE can make
      # a missing fixture a hard failure rather than a silent skip.
      - name: Check out the ACDP spec
        uses: actions/checkout@v7
        with:
          repository: agentcontextdistributionprotocol/agentcontextdistributionprotocol
          # Pinned so a spec-repo push cannot flip this job's result without
          # a commit here. Kept in sync with the pin in ci.yml's conformance
          # job automatically by bump-spec.yml. (main HEAD as of 2026-08-30)
          ref: d1f06d0d49b73d411a3983d3877321ccaccd38e7
          path: acdp-spec
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          # This build-check job is the regression guard for the "core
          # stays wasm-clean" invariant: a tokio/reqwest/ring-flavoured
          # dependency creeping into a core crate breaks it here.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          workspaces: bindings/acdp-wasm
      # 1. Native golden-vector parity: the same pure `core` functions the
      #    wasm exports wrap must reproduce sig-001 / wit-001 byte-for-byte
      #    (parity with the acdp-py / acdp-node suites and the Rust core).
      - name: Golden-vector parity (native)
        working-directory: bindings/acdp-wasm
        env:
          ACDP_SPEC_DIR: ${{ github.workspace }}/acdp-spec
          ACDP_REQUIRE_CONFORMANCE: "1"
        run: cargo test --locked
      # 2. The wasm32-unknown-unknown build itself (verify-first default
      #    feature set — no getrandom draw at runtime, backend wired only
      #    to link). Debug + release so opt-level="s"/LTO also stay green.
      - name: Build wasm32-unknown-unknown (verifier core)
        working-directory: bindings/acdp-wasm
        run: |
          cargo build --locked --target wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown
      # 3. Full browser package emit: wasm-pack runs wasm-bindgen + wasm-opt
      #    and produces the .js / .wasm / .d.ts a browser (the console)
      #    imports. Proves the FFI surface links end to end.
      - uses: taiki-e/install-action@0751bff5da373f43f04fdc57a72795931a822bd7 # wasm-pack
        with:
          tool: wasm-pack@0.15.0
          # A version absent from this SHA's manifest must fail the job, not
          # silently rebuild from QuickInstall (a third-party source) via
          # install-action's own `fallback` default. See docs/supply-chain.md
          # "Pinned-tool inventory".
          fallback: none
      - name: wasm-pack build (--target web)
        working-directory: bindings/acdp-wasm
        # `-- --locked` is forwarded to the underlying `cargo build`, but it
        # is NOT a gate: wasm-pack's own internal `cargo metadata` call
        # (used to read the crate name/version) runs unlocked and silently
        # repairs Cargo.lock before cargo ever sees --locked, so a lockfile
        # missing an entry gets that entry re-added rather than the build
        # failing (verified locally by removing an entry from Cargo.lock —
        # this command succeeds and rewrites the lock). Kept anyway because
        # it's harmless and correct if wasm-pack's internals ever change,
        # but the real gates in this job are the two `cargo build --locked`
        # runs directly above.
        run: |
          wasm-pack build --target web --out-dir pkg -- --locked
          test -f pkg/acdp_wasm.js
          test -f pkg/acdp_wasm_bg.wasm
          test -f pkg/acdp_wasm.d.ts
      # 4. Exercise the exported wrappers in a REAL wasm engine (Node's V8)
      #    via wasm-bindgen-test — proves the FFI surface links and runs,
      #    not just that it compiles.
      - name: wasm-pack test (--node)
        working-directory: bindings/acdp-wasm
        # `-- --locked` forwarded for consistency with the `wasm-pack build`
        # step above, but same as there it is NOT a gate: wasm-pack's own
        # unlocked internal `cargo metadata` call repairs Cargo.lock before
        # cargo ever sees --locked. The real gates in this job are the two
        # `cargo build --locked` runs and the `cargo test --locked` above.
        run: wasm-pack test --node -- --locked

  binding-copies-parity:
    name: v030.rs / v040.rs triplicate drift guard
    runs-on: ubuntu-latest
    # bindings/{acdp-py,acdp-node,acdp-wasm}/src/v030.rs are three
    # byte-identical copies of the same 0.3.0 verdict logic (same for
    # v040.rs) — there is no shared module and no sync mechanism, so an
    # edit applied to one copy and not the others compiles fine and only
    # shows up as a silent behavioral divergence between bindings. This
    # job is a cheap tripwire for that: it does not build or dedupe
    # anything, it just proves the three files still agree byte-for-byte.
    # No Rust/Node/Python toolchain needed — just a checkout and md5sum.
    steps:
      - uses: actions/checkout@v7
      - name: Compare v030.rs and v040.rs across the three bindings
        run: |
          set -euo pipefail
          check_identical() {
            file="$1"
            a="bindings/acdp-py/src/$file"
            b="bindings/acdp-node/src/$file"
            c="bindings/acdp-wasm/src/$file"
            sum_a=$(md5sum "$a" | cut -d' ' -f1)
            sum_b=$(md5sum "$b" | cut -d' ' -f1)
            sum_c=$(md5sum "$c" | cut -d' ' -f1)
            if [ "$sum_a" != "$sum_b" ] || [ "$sum_a" != "$sum_c" ]; then
              echo "::error::$file has diverged across bindings — these three files" \
                   "must stay byte-identical:"
              echo "  $a  $sum_a"
              echo "  $b  $sum_b"
              echo "  $c  $sum_c"
              echo "Apply the same edit to all three (this is a tripwire, not a fix —" \
                   "there is deliberately no shared module; each of" \
                   "bindings/{acdp-py,acdp-node,acdp-wasm}/src/$file must be" \
                   "edited in lockstep)."
              exit 1
            fi
            echo "OK: $file identical ($sum_a) across acdp-py, acdp-node, acdp-wasm"
          }
          check_identical v030.rs
          check_identical v040.rs

  interop:
    name: interop (python ↔ node)
    runs-on: ubuntu-latest
    needs: [acdp-py, acdp-node, acdp-wasm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          workspaces: |
            bindings/acdp-py
            bindings/acdp-node
            bindings/acdp-wasm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # `maturin develop` requires an active venv — see acdp-py job.
      - name: Create and activate venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin==1.15.0' 'pytest==8.4.2'
      # See the acdp-py job's identical assertion step for why these
      # exact versions (pytest==8.4.2, not the newer 9.x) were chosen.
      - name: Assert the pinned maturin + pytest versions
        run: |
          python -c 'import importlib.metadata as m, sys; sys.exit(0 if m.version("maturin") == "1.15.0" else 1)'
          python -c 'import importlib.metadata as m, sys; sys.exit(0 if m.version("pytest") == "8.4.2" else 1)'
      - name: Build the Python SDK (editable)
        working-directory: bindings/acdp-py
        run: maturin develop --release --locked
      - name: Build the Node.js SDK
        working-directory: bindings/acdp-node
        # See the acdp-node job's "Build the native binary" step for why
        # this needs a doubled `--` to reach napi's cargo passthrough.
        run: |
          npm install
          npm run build:debug -- -- --locked
      - uses: taiki-e/install-action@0751bff5da373f43f04fdc57a72795931a822bd7 # wasm-pack
        with:
          tool: wasm-pack@0.15.0
          # A version absent from this SHA's manifest must fail the job, not
          # silently rebuild from QuickInstall (a third-party source) via
          # install-action's own `fallback` default. See docs/supply-chain.md
          # "Pinned-tool inventory".
          fallback: none
      - name: Build the wasm SDK
        run: cd bindings/acdp-wasm && wasm-pack build --target web --out-dir pkg
      # Whole dir: cross-language behavioral parity (test_interop.py) AND
      # the API-surface + version drift guards (test_parity.py). Fails the
      # build if the two SDKs ever diverge in surface, behavior, or version.
      - name: Cross-language interop + parity pytest
        working-directory: bindings/interop
        env:
          ACDP_REQUIRE_WASM_PARITY: "1"
        run: pytest -v

  bindings-deny:
    name: cargo-deny (bindings, ${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # RS-10: the workspace `exclude`s bindings/, so the root `deny` job
        # (ci.yml) never sees these graphs.
        dir: [bindings/acdp-py, bindings/acdp-node, bindings/acdp-wasm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      # Same install mechanism as ci.yml's `deny` job (see its comment for
      # why not EmbarkStudios/cargo-deny-action).
      - uses: taiki-e/install-action@0751bff5da373f43f04fdc57a72795931a822bd7 # cargo-deny
        with:
          tool: cargo-deny@0.19.9
          # A version absent from this SHA's manifest must fail the job, not
          # silently rebuild from QuickInstall (a third-party source) via
          # install-action's own `fallback` default. See docs/supply-chain.md
          # "Pinned-tool inventory".
          fallback: none
      # advisories only (not bare `check`): the root deny.toml's
      # [licenses]/[bans]/[sources] policy was never audited against the
      # bindings' transitive graphs, so keep this gate narrowly about
      # vulnerabilities, matching what RS-10 actually asks for. The
      # lockfiles are tracked (see .gitignore's bindings section for why),
      # and every build step above runs `--locked` against them; this
      # invocation now passes `--locked` too, so it audits that same
      # pinned graph rather than whatever `cargo metadata` would freshly
      # resolve here. A new RUSTSEC advisory against an already-pinned
      # dependency can still turn this red with no code change in this
      # repo; that's expected for a supply-chain gate, not a flake to
      # silence.
      - run: cargo deny --manifest-path ${{ matrix.dir }}/Cargo.toml --locked check --config deny.toml advisories

  bindings-npm-audit:
    name: npm audit (acdp-node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # bindings/acdp-node/package-lock.json is committed (see .gitignore's
      # acdp-node section) and `npm install` honors it, resolving the pinned
      # graph rather than fresh.
      - working-directory: bindings/acdp-node
        run: npm install
      - working-directory: bindings/acdp-node
        run: npm audit
