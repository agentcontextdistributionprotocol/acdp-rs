name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo clippy -p acdp --no-default-features --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os:   ubuntu-latest
            rust: beta
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
      - run: cargo test --workspace --all-features
      - run: cargo test -p acdp --no-default-features
      - run: cargo build --all-features --examples

  conformance:
    name: conformance (spec fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the ACDP spec
        uses: actions/checkout@v7
        with:
          repository: agentcontextdistributionprotocol/agentcontextdistributionprotocol
          # Pinned so a spec-repo push cannot change this repo's CI result
          # without a commit here. Bump deliberately when adopting new
          # fixtures. (main HEAD as of 2026-08-28)
          ref: 108ff76d12eb05aa1bbffa01832e705d47187575
          path: acdp-spec
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
      # ACDP_REQUIRE_CONFORMANCE makes a missing spec a hard failure, so
      # a green run genuinely proves conformance — the fixtures are not
      # silently skipped (IMP-02).
      - name: Conformance (spec fixtures required)
        env:
          ACDP_SPEC_DIR: ${{ github.workspace }}/acdp-spec
          ACDP_REQUIRE_CONFORMANCE: "1"
        run: cargo test --workspace --all-features

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2767295e193a2ee92d23c1ff586f596cb6d94a7a # 1.86.0
        with:
          toolchain: 1.86.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
      - run: cargo build --workspace --all-features
      - run: cargo build -p acdp --no-default-features

  doc:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
      - env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo doc --workspace --all-features --no-deps

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
      # Install a checksum-verified prebuilt binary (with retries) and run
      # `cargo deny` directly, rather than EmbarkStudios/cargo-deny-action,
      # whose Docker image intermittently failed extracting the cargo-deny
      # release tarball ("tar: Error is not recoverable") on several
      # Dependabot PRs. Same install mechanism as the coverage job's
      # cargo-llvm-cov.
      - uses: taiki-e/install-action@0751bff5da373f43f04fdc57a72795931a822bd7 # cargo-deny
        with:
          tool: cargo-deny@0.19.9
          # A version absent from this SHA's manifest must fail the job, not
          # silently rebuild from QuickInstall (a third-party source) via
          # install-action's own `fallback` default. See docs/supply-chain.md
          # "Pinned-tool inventory".
          fallback: none
      # Sole RUSTSEC advisory gate: `deny check` covers advisories, bans,
      # licenses, and sources from deny.toml, so a separate cargo-audit job
      # (which duplicated the RUSTSEC ignore list) is unnecessary.
      - run: cargo deny check

  vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
      - uses: taiki-e/install-action@c0ae9b92c15529ec87e792a1233f3f4a6c726bfa # cargo-vet
        with:
          tool: cargo-vet@0.10.2
          # KNOWN, ACCEPTED GAP: no install-action manifest at any SHA
          # carries cargo-vet 0.10.2 (checked through v2.87.7's
          # manifests/cargo-vet.json — only 0.10/0.10.0), so a SHA bump
          # cannot fix this. 0.10.0, the newest version the manifest does
          # have, can't parse this repo's supply-chain/imports.lock
          # (crates.io trusted-publisher schema — verified locally: "missing
          # field `user-id`"), so downgrading is blocked too. That leaves
          # only this: fall back to cargo-binstall explicitly, which installs
          # from QuickInstall, a third-party rebuild, not the upstream
          # release artifact. Every other install-action step in this repo
          # sets `fallback: none` and hard-fails on a manifest miss; this is
          # the one exception. See docs/supply-chain.md "Pinned-tool
          # inventory".
          fallback: cargo-binstall
      # BLOCKING supply-chain gate: every third-party dependency in the
      # locked graph must be covered by a cargo-vet audit, an imported
      # audit from a trusted set (mozilla/google/bytecode-alliance), or an
      # explicit exemption in supply-chain/config.toml. A new or bumped
      # dependency that is not yet vetted fails this job. See
      # docs/supply-chain.md for the certify/exempt contributor workflow.
      - run: cargo vet --locked

  semver:
    name: cargo-semver-checks (advisory)
    runs-on: ubuntu-latest
    # Advisory: version bumps land in release-plz's follow-up release PR,
    # so a PR carrying an intentional breaking change (feat!/BREAKING
    # CHANGE) correctly fails this check until that PR merges. Treat a
    # red result as a prompt to verify the commit is marked breaking —
    # release-plz derives the bump from the marker.
    continue-on-error: true
    outputs:
      status: ${{ steps.semver-checks.outputs.status }}
      unsupported: ${{ steps.semver-checks.outputs.unsupported }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
      # Pinned to a release-tagged commit (not just any main-branch commit):
      # that's what lets Dependabot's github-actions updater resolve the SHA
      # to a release via the git ref API and keep it bumped — the
      # `# vX.Y.Z` comment isn't the mechanism, it's just what Dependabot
      # rewrites to stay in sync. All other taiki-e/install-action pins in
      # this repo are untagged commits, which is why Dependabot can't map
      # them to a release and silently skips them — that's how this pin sat
      # frozen on a cargo-semver-checks@0.48 that can't parse current stable
      # rustdoc output while looking green (see the semver-tool-health job
      # below). Keep this tag-resolvable pattern on any future bump of this
      # line.
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-semver-checks@0.50.0
          # A version absent from this SHA's manifest must fail the job, not
          # silently rebuild from QuickInstall (a third-party source) via
          # install-action's own `fallback` default. See docs/supply-chain.md
          # "Pinned-tool inventory".
          fallback: none
      # Make the installed version deterministic in the log rather than
      # relying on install-action's own post-install `--version` call
      # (a third party's logging side effect, not ours to depend on).
      - run: cargo semver-checks --version
      # Compares every published workspace crate's public API against its
      # latest crates.io release and fails when a change requires a semver
      # bump the current version numbers don't carry. release-plz derives
      # the bump from Conventional Commits; this job catches the case
      # where an API break rides a commit that wasn't marked breaking.
      #
      # Deliberately left on `stable` (not pinned): this job's only value is
      # early warning for the BLOCKING release-plz gate, which itself runs
      # on stable and can't practically be pinned (the same job drives
      # `cargo publish`). Pinning just this canary would let it go green on
      # a frozen rustdoc format while the real gate breaks on the next
      # stable release — reproducing the exact silent outage this job
      # exists to catch, minus the warning.
      #
      # Streamed through `tee` instead of buffered into a shell variable so
      # the log is visible live and isn't lost on a runner timeout — exactly
      # when it's most needed. `${PIPESTATUS[0]}` recovers cargo-semver-
      # checks' own exit status from under `tee` (whose own exit status
      # would otherwise win). `status`/`unsupported` go to $GITHUB_OUTPUT so
      # the semver-tool-health job can classify the real numeric exit code
      # without relying on `needs.semver.result`, which `continue-on-error`
      # forces to `success` even when this step's own exit below is nonzero.
      - name: cargo semver-checks --workspace
        id: semver-checks
        run: |
          set +e
          cargo semver-checks --workspace 2>&1 | tee semver-checks.log
          s=${PIPESTATUS[0]}
          if grep -q "unsupported rustdoc format" semver-checks.log; then
            echo "unsupported=true" >> "$GITHUB_OUTPUT"
          else
            echo "unsupported=false" >> "$GITHUB_OUTPUT"
          fi
          echo "status=$s" >> "$GITHUB_OUTPUT"
          exit "$s"

  # NOT advisory, and deliberately not folded into the `semver` job above:
  # that job is `continue-on-error: true` so an intentional `feat!` can
  # legitimately redden it without failing the PR, but that same masking is
  # what let cargo-semver-checks sit broken for months reporting a false
  # "compatible" on every run (see release-plz.yml's MarcoIeni/release-plz-action
  # comment for the incident this is guarding against). This job fails only
  # when the TOOL itself is broken — it can't parse the rustdoc it was
  # given, or exits abnormally — never on a genuine detected API break,
  # which is treated as this job's success case.
  #
  # Classifies the `semver` job's own run instead of re-running
  # `cargo semver-checks --workspace` a second time — that used to mean
  # generating rustdoc for every workspace crate twice (current + baseline)
  # and a second rust-cache entry for no extra signal. `needs: [semver]` +
  # `if: ${{ !cancelled() }}` means this still runs when `semver` "fails"
  # (i.e. on any detected break); it needs no checkout, toolchain,
  # rust-cache, or install-action of its own. Not `always()`: the
  # `cancel-in-progress: true` concurrency group above makes a superseded
  # run routine on every follow-up push to a PR, and a tool-health tripwire
  # that reds on mere cancellation carries no signal — it just trains
  # people to ignore it.
  semver-tool-health:
    name: semver-tool-health
    needs: [semver]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Classify cargo-semver-checks' exit status
        env:
          STATUS: ${{ needs.semver.outputs.status }}
          UNSUPPORTED: ${{ needs.semver.outputs.unsupported }}
        run: |
          # cargo-semver-checks (src/main.rs:18-21,205-213) uses fixed exit
          # codes:
          #   0   = clean, no version bump required.
          #   100 = LINT_FAILURE_EXIT_CODE — a deny-level lint fired, i.e.
          #         the tool WORKED and found a genuine semver-incompatible
          #         change. Both major- and minor-only breaks share one
          #         format string ("semver requires new {major,minor}
          #         version: ... checks failed", check_release.rs:566) and
          #         both exit 100 — classify on the code, never that text.
          #         This is this job's success case.
          #   101 = ERROR_EXIT_CODE — a tool error or a transient
          #         infrastructure failure (baseline fetch, crates.io
          #         unreachable, etc).
          #   anything else (e.g. 137 SIGKILL) = abnormal.
          if [ "$UNSUPPORTED" = "true" ]; then
            echo "::error::cargo-semver-checks cannot parse this rustdoc format — the tool is broken, not the crate. See release-plz.yml's MarcoIeni/release-plz-action comment."
            exit 1
          fi
          if [ -z "$STATUS" ]; then
            echo "::error::semver job reported no exit status (the runner died, or the job failed before this check ran) — treating this as a tool-health failure, fail-closed."
            exit 1
          fi
          if [ "$STATUS" -eq 0 ] || [ "$STATUS" -eq 100 ]; then
            echo "Tool ran and either found no break (0) or correctly reported a genuine semver-incompatible change (100); treating as tool-healthy."
            exit 0
          fi
          echo "::error::cargo-semver-checks exited with status $STATUS — a tool error or transient infrastructure failure, not a recognizable API-break result. Treating this as a tool-health failure, not an API break."
          exit 1

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
      - uses: taiki-e/install-action@7c1105379b6217809b9ed26c163a46c65c7a528f # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.8.7
          # A version absent from this SHA's manifest must fail the job, not
          # silently rebuild from QuickInstall (a third-party source) via
          # install-action's own `fallback` default. See docs/supply-chain.md
          # "Pinned-tool inventory".
          fallback: none
      - run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
