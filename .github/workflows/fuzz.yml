name: Fuzz

on:
  schedule:
    # Weekly, Monday 04:17 UTC (off the top of the hour to dodge load spikes).
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR gate: the fuzz workspace must keep compiling. Build only — no run.
  build:
    name: fuzz build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.9.1
        with:
          workspaces: fuzz
      # KNOWN, ACCEPTED GAP: this SHA predates install-action's `fallback`
      # input entirely (only `tool`/`checksum` exist in its action.yml at
      # this pin), so there is no `fallback: none` to add here — the
      # cargo-binstall fallback is unconditional at this SHA and cannot be
      # disabled. A `tool:` version absent from this SHA's manifest would
      # therefore silently reinstall from QuickInstall, a third-party
      # rebuild, rather than hard-failing. Today cargo-fuzz@0.11.2 IS in
      # this SHA's manifest and equals its `latest`, so nothing falls back.
      # Bumping the SHA is not a fix either: cargo-fuzz has been dropped
      # from install-action's manifest set entirely (also gone from its
      # TOOLS.md), so a newer SHA guarantees a permanent manifest miss. See
      # docs/supply-chain.md "Pinned-tool inventory" / "Known gap —
      # cargo-fuzz".
      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422 # cargo-fuzz
        with:
          tool: cargo-fuzz@0.11.2
      - run: cargo fuzz build --target x86_64-unknown-linux-gnu

  run:
    name: fuzz run (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_jcs, fuzz_wire, fuzz_did_doc, fuzz_ssrf]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.9.1
        with:
          workspaces: fuzz
      # KNOWN, ACCEPTED GAP: this SHA predates install-action's `fallback`
      # input entirely (only `tool`/`checksum` exist in its action.yml at
      # this pin), so there is no `fallback: none` to add here — the
      # cargo-binstall fallback is unconditional at this SHA and cannot be
      # disabled. A `tool:` version absent from this SHA's manifest would
      # therefore silently reinstall from QuickInstall, a third-party
      # rebuild, rather than hard-failing. Today cargo-fuzz@0.11.2 IS in
      # this SHA's manifest and equals its `latest`, so nothing falls back.
      # Bumping the SHA is not a fix either: cargo-fuzz has been dropped
      # from install-action's manifest set entirely (also gone from its
      # TOOLS.md), so a newer SHA guarantees a permanent manifest miss. See
      # docs/supply-chain.md "Pinned-tool inventory" / "Known gap —
      # cargo-fuzz".
      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422 # cargo-fuzz
        with:
          tool: cargo-fuzz@0.11.2
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=300
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
