name: publish-acdp-chain-once

# One-off: crates.io Trusted Publishing cannot create a new crate, so
# acdp-chain's first publish uses a regular token. Delete this workflow
# (and revoke the CARGO_REGISTRY_TOKEN secret) once acdp-chain has a
# trusted publisher on crates.io; release-plz.yml publishes it after that.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'agentcontextdistributionprotocol' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Publish acdp-chain
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="acdp-chain") | .version')
          if curl -sf -A "acdp-rs publish-acdp-chain-once" \
               "https://crates.io/api/v1/crates/acdp-chain/$VER" >/dev/null; then
            echo "acdp-chain $VER is already on crates.io"; exit 0
          fi
          cargo publish -p acdp-chain --locked
