name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch the SDK binding release workflows

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

# Supply-chain note (crates.io provenance) — see docs/supply-chain.md §crates.io.
# release-plz drives `cargo publish`, which today has no build-provenance /
# attestation mechanism comparable to npm --provenance or PyPI attestations;
# crates.io Trusted Publishing (OIDC, no long-lived token) is being rolled out
# upstream. This workflow is DELIBERATELY LEFT on the CARGO_REGISTRY_TOKEN flow
# and its version/publish behavior is unchanged. Migrating to crates.io Trusted
# Publishing is tracked as a conservative follow-up (roadmap §6.5): when
# release-plz-action documents an `id-token: write` OIDC path, add
# `permissions: id-token: write` to THIS job only and drop CARGO_REGISTRY_TOKEN.
jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'agentcontextdistributionprotocol' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      # This action's own action.yml hardcodes the cargo-semver-checks version
      # it installs — that pin is what makes release-plz.toml's
      # `semver_check = true` BLOCKING gate actually run (it is not
      # reachable from ci.yml). v0.5.131 carried a cargo-semver-checks@0.48
      # that dies on current stable rustdoc's output format and fails OPEN
      # (silently reports "compatible"). v0.5.133's action.yml pins @0.50,
      # which supports the current rustdoc formats. Bumping this is not a
      # routine dependency bump: re-verify which cargo-semver-checks version
      # the target tag's action.yml installs before moving this pin again.
      - uses: MarcoIeni/release-plz-action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # #231: release-plz bumps the 13 workspace crates but cannot maintain the
      # three binding lockfiles (separate workspaces, excluded from the root;
      # release-plz 0.3.x has no hook mechanism). Sync them onto the release PR
      # branch here. `cargo update --workspace` provably touches ONLY the
      # workspace path-dep `version = ` lines (32 across the three dirs) and
      # declines to move third-party pins, so the #196/#225 --locked guarantees
      # are preserved; the diff guard below hard-fails rather than committing if
      # cargo ever moves a non-version line. Idempotent: a no-op run exits early.
      # KNOWN WART (accepted): this push authenticates as GITHUB_TOKEN, which
      # triggers no new workflow runs, so the release PR's advisory `bindings`
      # check stays visually stale. Harmless — `bindings` is not a required
      # context, and the post-merge SDK release workflows (which run --ref main
      # and hold the real `cargo metadata --locked` gates) see the synced files.
      - name: Sync binding lockfiles to the release version
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).head_branch }}
        run: |
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD
          for d in bindings/acdp-py bindings/acdp-node bindings/acdp-wasm; do
            (cd "$d" && cargo update --workspace)
          done
          if git diff -U0 -- bindings/ | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
               | grep -vE '^[+-]version = "' ; then
            echo "::error::cargo update -w touched a non-version line; aborting"; exit 1
          fi
          git diff --quiet -- bindings/ && { echo "lockfiles already in sync"; exit 0; }
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bindings/acdp-py/Cargo.lock bindings/acdp-node/Cargo.lock bindings/acdp-wasm/Cargo.lock
          git commit -m 'chore(bindings): sync binding lockfiles to the release version'
          git push origin HEAD:"$BRANCH"
          for d in bindings/acdp-py bindings/acdp-node bindings/acdp-wasm; do
            (cd "$d" && cargo metadata --locked --format-version 1 >/dev/null)
          done

      # When the `acdp` crate itself publishes (not the other workspace crates),
      # notify the crate consumer (acdp-registry-rs) so it opens an auto-bump PR
      # via acdp-ci's bump-consume. App-authenticated (org secrets) — no PAT.
      - name: Detect acdp crate publish
        id: acdp
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          VER=$(printf '%s' '${{ steps.release.outputs.releases }}' \
            | jq -r '.[] | select(.package_name=="acdp") | .version' | head -1)
          if [ -n "$VER" ]; then
            echo "released=true"  >> "$GITHUB_OUTPUT"
            echo "version=$VER"   >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint token for acdp-registry-rs
        id: dispatch-token
        if: ${{ steps.acdp.outputs.released == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACDP_BOT_APP_ID }}
          private-key: ${{ secrets.ACDP_BOT_PRIVATE_KEY }}
          owner: agentcontextdistributionprotocol
          repositories: acdp-registry-rs
      - name: Dispatch acdp-released (cargo)
        if: ${{ steps.acdp.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          VER: ${{ steps.acdp.outputs.version }}
        run: |
          jq -nc --arg v "$VER" --arg e cargo '{event_type:"acdp-released",client_payload:{version:$v,ecosystem:$e}}' \
            | gh api repos/agentcontextdistributionprotocol/acdp-registry-rs/dispatches --method POST --input -

      # Release the language SDKs (PyPI + npm) at the SAME version, so the
      # whole ecosystem stays in lockstep with the crates. Each binding
      # release workflow stamps this version into its manifests before
      # building, so the published artifact version == the acdp version.
      # workflow_dispatch is exempt from the GITHUB_TOKEN "no recursive
      # workflow runs" rule, so these dispatched runs DO execute.
      - name: Release SDK bindings at the acdp version
        if: ${{ steps.acdp.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.acdp.outputs.version }}
        run: |
          for wf in acdp-py-release.yml bindings-release.yml acdp-wasm-release.yml; do
            echo "dispatching $wf for acdp $VER"
            gh workflow run "$wf" --ref main -f version="$VER" -f dry_run=false
          done
