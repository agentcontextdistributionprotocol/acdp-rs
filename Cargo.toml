[workspace]
members  = ["crates/*"]
exclude  = ["bindings"]
resolver = "2"

# Single lockstep version for the whole acdp family. Every member sets
# `version.workspace = true` and every inter-crate dependency pins the
# exact shared version (`=x.y.z`), so one number identifies a coherent
# set and a fresh resolver cannot mix release generations. Bump all
# crates together (release-plz groups them via `version_group`).
[workspace.package]
version = "0.11.0"

[package]
name    = "acdp"
version.workspace = true
edition = "2021"
description   = "Rust client library for the Agent Context Distribution Protocol (ACDP v0.1.0 + v0.2.0 Trust & Hardening)"
license       = "MIT OR Apache-2.0"
readme        = "README.md"
repository    = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
homepage      = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
documentation = "https://docs.rs/acdp"
keywords      = ["acdp", "agent", "context", "did", "verifiable"]
categories    = ["web-programming", "cryptography", "data-structures"]
rust-version  = "1.86"
exclude       = [
    "/.github",
    "/target",
    "/examples",
    "/tests",
    "/plans",
    "/.gitignore",
    "/deny.toml",
    "/rustfmt.toml",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]

[features]
default = ["client"]
# Enabling `client` also turns on the resolver-backed server path *only
# when `server` is already enabled* (`acdp-server?/client`), so the
# combined client+server test harness gets RegistryServer::publish_verified.
client  = ["dep:acdp-client", "acdp-primitives/reqwest", "acdp-server?/client"]
server  = ["dep:acdp-server"]
tracing = [
    "acdp-did/tracing",
    "acdp-client?/tracing",
    "acdp-verify/tracing",
    "acdp-server?/tracing",
]
# Opts into the SSRF-relaxed test-only constructors
# (`SsrfPolicy::allow_test_loopback`, `RegistryClient::{with_root_cert_pem,
# with_test_transport, with_test_endpoint}`, `WebResolver::with_test_endpoint`).
# Without it those constructors do not exist at all: each is
# `#[cfg(feature = "test-transport")]`-gated, not merely deprecated.
# Never enable in production builds.
test-transport = [
    "acdp-safe-http/test-transport",
    "acdp-did/test-transport",
    "acdp-client?/test-transport",
]

# TLS-backed fixture conformance tests need both the `client` (resolver,
# RegistryClient, CrossRegistryResolver) and `server` (RegistryServer,
# InMemoryStore — used by the pub-003 supersession lineage test) features.
# `--no-default-features` test runs skip them entirely.
[[test]]
name              = "tls_conformance"
path              = "tests/tls_conformance.rs"
required-features = ["client", "server", "test-transport"]

# The end-to-end example drives `RegistryClient` against a wiremock mock
# registry, so it needs the `client` feature. Declared here (rather than
# left to auto-discovery) so `--no-default-features` builds skip it
# instead of failing to compile. `producer`, `consumer`, and
# `supersession` use only the always-on core and need no gate.
[[test]]
name              = "registry_client"
path              = "tests/registry_client.rs"
required-features = ["client", "test-transport"]

[[example]]
name              = "end_to_end"
path              = "examples/end_to_end.rs"
required-features = ["client", "test-transport"]

# Receipt end-to-end tests (RFC-ACDP-0010) drive the in-process TLS
# registry harness: `client` for the resolver/RegistryClient, `server`
# for RegistryServer + InMemoryStore.
[[test]]
name              = "receipts"
path              = "tests/receipts.rs"
required-features = ["client", "server", "test-transport"]

# Lineage-head receipt end-to-end tests (RFC-ACDP-0011) drive the same
# in-process TLS registry harness as `receipts`.
[[test]]
name              = "lineage_head_receipts"
path              = "tests/lineage_head_receipts.rs"
required-features = ["client", "server", "test-transport"]

# Lifecycle-event / retraction tests (RFC-ACDP-0013) bind the lc-001..003
# fixtures at the RegistryServer API level. did:key producers keep the
# full signature-verification pipeline offline, so only `server` is
# needed — no TLS harness, no `client` feature.
[[test]]
name              = "lifecycle"
path              = "tests/lifecycle.rs"
required-features = ["server"]

# Key-revocation fixture bindings (RFC-ACDP-0014, rev-001/rev-002):
# golden-vector arithmetic plus the §7 boundary matrix through the same
# in-process TLS registry harness as `receipts`.
[[test]]
name              = "key_revocation"
path              = "tests/key_revocation.rs"
required-features = ["client", "server", "test-transport"]

# RFC-ACDP-0014 §5 step 2 on the did:web RegistryServer publish path
# (#207 Phase 7). Separate from `key_revocation` above so that file can
# stay at ZERO edits; needs the same TLS DID-document harness.
[[test]]
name              = "key_revocation_publish_gate"
path              = "tests/key_revocation_publish_gate.rs"
required-features = ["client", "server", "test-transport"]

# Resolver-backed verification algorithm (RFC-ACDP-0001 §5.11) per-step
# error branches, driven through the in-process TLS DID-document harness.
# Needs `client` for the WebResolver/Verifier and `test-transport` for the
# loopback SsrfPolicy + self-signed root trust.
[[test]]
name              = "verify_algorithm"
path              = "tests/verify_algorithm.rs"
required-features = ["client", "test-transport"]
# Criterion benchmarks for the crypto / JCS / SSRF hot paths.
# `harness = false` hands `main` to criterion instead of libtest.
[[bench]]
name    = "core"
path    = "benches/core.rs"
harness = false

# The umbrella `acdp` crate is a thin facade: its library is pure
# re-exports of the workspace crates below. The concrete third-party
# crates live in `[dev-dependencies]` (used only by the integration
# tests and examples that still live here).
[dependencies]
acdp-primitives = { path = "crates/acdp-primitives", version = "=0.11.0" }
acdp-jcs        = { path = "crates/acdp-jcs", version = "=0.11.0" }
acdp-safe-http  = { path = "crates/acdp-safe-http", version = "=0.11.0" }
acdp-did        = { path = "crates/acdp-did", version = "=0.11.0" }
acdp-crypto     = { path = "crates/acdp-crypto", version = "=0.11.0" }
acdp-types      = { path = "crates/acdp-types", version = "=0.11.0" }
acdp-validation = { path = "crates/acdp-validation", version = "=0.11.0" }
acdp-verify     = { path = "crates/acdp-verify", version = "=0.11.0" }
acdp-producer   = { path = "crates/acdp-producer", version = "=0.11.0" }
acdp-client     = { path = "crates/acdp-client", version = "=0.11.0", optional = true }
acdp-server     = { path = "crates/acdp-server", version = "=0.11.0", optional = true }

[dev-dependencies]
serde         = { version = "1", features = ["derive"] }
serde_json    = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2          = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core"] }
p256          = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
base64        = "0.23"
hex           = "0.4"
bs58          = "0.5"
chrono        = { version = "0.4", features = ["serde"] }
uuid          = { version = "1", features = ["v4"] }
url           = "2"
urlencoding   = "2"
tokio    = { version = "1", features = ["full"] }
anyhow   = "1"
criterion = "0.8"
wiremock = "0.6"
proptest = "1"
# TLS test harness — used to mock a `did:web` HTTPS endpoint and a
# foreign registry so conformance fixtures pub-001 / pub-003 / pub-006
# and fed-001..006 can be bound to behavioral assertions without going
# over the network. Kept in dev-dependencies so they don't propagate to
# downstream consumers.
rcgen        = { version = "0.14", default-features = false, features = ["pem", "ring"] }
axum         = { version = "0.8", default-features = false, features = ["json", "query"] }
axum-server  = { version = "0.8", default-features = false, features = ["tls-rustls"] }
# rustls 0.23 requires the process to install a crypto provider before
# the first TLS handshake — there's no auto-detect when more than one
# backend is in scope. We install `aws-lc-rs` (matches what `axum-server`'s
# `tls-rustls` feature pulls in transitively).
rustls       = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[package.metadata.docs.rs]
all-features        = true
rustdoc-args        = ["--cfg", "docsrs"]
targets             = ["x86_64-unknown-linux-gnu"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
