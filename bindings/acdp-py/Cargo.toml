# Standalone package: NOT a member of the parent acdp-rs crate (acdp-rs is
# a single-package crate with no [workspace] table). Built by maturin
# against an external CPython, so it carries its own [workspace] table.
#
# The acdp library is pulled in via path; turning on its `client` feature
# would compile reqwest / tokio / rustls into the wheel. The Python SDK
# never makes HTTP calls — host code is expected to do that with httpx /
# requests — so we deliberately keep `default-features = false`.
[package]
name        = "acdp-py"
version = "0.10.0"
edition     = "2021"
description = "Agent Context Distribution Protocol — Python SDK"
license     = "MIT OR Apache-2.0"
publish     = false

[workspace]

[lib]
name       = "acdp"
crate-type = ["cdylib"]

# `extension-module` is opt-in so `cargo check` / `cargo build` work
# standalone. maturin enables it via pyproject.toml `[tool.maturin]`.
# A plain `cargo build` (feature off) links libpython for local testing;
# the importable wheel MUST be built with the feature on.
[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
acdp       = { path = "../..", default-features = false, features = ["test-transport"] }
# ^ test-transport: the bindings deliberately re-export allow_test_loopback
#   on their pinned FFI surface (expected_surface.json) as a HOST-side test
#   helper; the Rust-side hard gate targets Rust dependency trees.
# abi3-py39: build a single forward-compatible wheel (cp39-abi3) per
# platform that runs on CPython 3.9+ via the stable ABI, instead of one
# wheel per interpreter version. Keeps the release matrix to one build
# per OS/arch and matches `requires-python = ">=3.9"` in pyproject.toml.
pyo3       = { version = "0.29", features = ["abi3-py39"] }
serde_json = "1"
base64     = "0.23"
# Used only to parse the `expires_at` RFC 3339 string into the
# `DateTime<Utc>` the builder expects. `serde` feature matches the
# parent crate so the parsed value round-trips identically.
chrono     = { version = "0.4", features = ["serde"] }
# `Zeroizing<[u8; 32]>` wipes the seed when the pyclass is dropped, so
# we don't strip the protection the Rust `SigningKey` provides.
zeroize    = "1"
# `AcdpCanonicalizer.content_hash` hashes the JCS form. Versions match the
# parent crate so the digest is byte-identical to the core content_hash.
sha2       = "0.11"
hex        = "0.4"

[profile.release]
lto           = true
codegen-units = 1
strip         = "symbols"
