[package]
name        = "acdp-jcs"
version.workspace = true
edition     = "2021"
description = "RFC 8785 JSON Canonicalization Scheme (JCS) implementation used by the Agent Context Distribution Protocol (ACDP)"
license     = "MIT OR Apache-2.0"
readme      = "README.md"
repository  = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
homepage    = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
documentation = "https://docs.rs/acdp-jcs"
keywords    = ["acdp", "jcs", "rfc8785", "canonicalization", "json"]
categories  = ["encoding", "data-structures"]
rust-version = "1.86"

[dependencies]
acdp-primitives = { path = "../acdp-primitives", version = "=0.13.2" }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
sha2 = "0.11"
hex  = "0.4"
# Same major-version pin as the root workspace's proptest_jcs.rs harness.
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
