[package]
name        = "acdp-producer"
version.workspace = true
edition     = "2021"
description = "Publish-request builder (build + validate + hash + sign) for the Agent Context Distribution Protocol (ACDP)"
license     = "MIT OR Apache-2.0"
readme      = "README.md"
repository  = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
homepage    = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
documentation = "https://docs.rs/acdp-producer"
keywords    = ["acdp", "producer", "publish", "agent", "context"]
categories  = ["web-programming", "cryptography"]
rust-version = "1.86"

[dependencies]
acdp-primitives = { path = "../acdp-primitives", version = "=0.14.2" }
acdp-types      = { path = "../acdp-types", version = "=0.14.2" }
acdp-crypto     = { path = "../acdp-crypto", version = "=0.14.2" }
acdp-did        = { path = "../acdp-did", version = "=0.14.2" }
acdp-validation = { path = "../acdp-validation", version = "=0.14.2" }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
chrono     = { version = "0.4", features = ["serde"] }
hex        = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
