[package]
name        = "acdp-server"
version.workspace = true
edition     = "2021"
description = "Registry-side building blocks (PublishValidator, RegistryServer, store, pagination) for the Agent Context Distribution Protocol (ACDP)"
license     = "MIT OR Apache-2.0"
readme      = "README.md"
repository  = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
homepage    = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
documentation = "https://docs.rs/acdp-server"
keywords    = ["acdp", "registry", "server", "agent", "context"]
categories  = ["web-programming", "data-structures"]
rust-version = "1.86"

[features]
# Enables the resolver-backed publish path (did:web DID-document fetch +
# signature verification). The offline did:key publish path works without it.
client = [
    "acdp-did/client",
    "acdp-verify/client",
    "acdp-crypto/client",
    "acdp-safe-http/client",
]
# Structured diagnostics on the publish pipeline (spans + commit events).
tracing = ["dep:tracing", "acdp-verify/tracing"]

[dependencies]
acdp-primitives = { path = "../acdp-primitives", version = "=0.12.0" }
acdp-types      = { path = "../acdp-types", version = "=0.12.0" }
acdp-crypto     = { path = "../acdp-crypto", version = "=0.12.0" }
acdp-did        = { path = "../acdp-did", version = "=0.12.0" }
acdp-validation = { path = "../acdp-validation", version = "=0.12.0" }
acdp-verify     = { path = "../acdp-verify", version = "=0.12.0" }
tracing         = { version = "0.1", optional = true, default-features = false, features = ["attributes"] }
acdp-producer   = { path = "../acdp-producer", version = "=0.12.0" }
acdp-safe-http  = { path = "../acdp-safe-http", version = "=0.12.0" }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
chrono     = { version = "0.4", features = ["serde"] }
base64     = "0.23"
uuid       = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
