# release-plz configuration.
#
# Previously release-plz ran on pure defaults. This file makes the
# defaults we rely on explicit and enables an API-compatibility check at
# release time.
[workspace]
# Run cargo-semver-checks inside release-plz when computing the release
# PR. This is a version-bump *corrector*, not a blocking gate: when it
# detects a breaking change, release-plz raises the computed bump for the
# affected crate(s) to a major version instead of the patch/minor bump the
# commit prefixes alone would have produced. It never refuses to open the
# release PR and never blocks on a detected break.
#
# Empirically confirmed against the pinned
# `MarcoIeni/release-plz-action@aec534bb` (v0.5.133): PR #227 added a field
# to `PublishCommit` (a `feat(server)!:` commit). `cargo semver-checks`
# reported `constructible_struct_adds_field` ("semver requires new major
# version") against that struct. release-plz did not refuse anything — it
# opened release PR #228, computing 0.10.0 (from 0.9.1) across all 13
# workspace crates, with the semver-checks failure reproduced verbatim in
# the PR body alongside `acdp-server`'s major bump. (That specific bump was
# already over-determined — PR #227 was itself marked `feat(server)!:`, and
# `version_group = "acdp"` ties all 13 crates to one version — so this
# observation confirms release-plz didn't block on the detected break, not
# that the semver-checks failure is what raised the bump the commit
# prefixes alone would not have produced.)
#
# That is still the property #208 cared about (PR #188 proposed a PATCH
# bump that carried a break): without this check, a break can ride out
# under a version number that promises compatibility. The protection is
# against a *wrong-version publish*, never against *publishing* a break.
semver_check = true

# Label the release PRs release-plz opens.
pr_labels = ["release"]

# Only cut a release when a commit actually changes shipped behaviour.
#
# Without this, ANY commit since the last tag makes release-plz consider the
# package changed — including a commit that touches nothing but CHANGELOG.md.
# That happened on 2026-09-06: de7fff5 backfilled the missing 0.9.1 stanza for
# eight sub-crates (docs only, zero code) and release-plz opened PR #221
# proposing a full 0.9.2 bump of all 13 crates whose entire release content was
# that backfill. Publishing it would have burned a version on crates.io
# artifacts functionally identical to 0.9.1 — and crates.io publishes are
# irreversible.
#
# The regex is matched against the conventional-commit type, so `feat!:`,
# `fix(server):` and `perf:` all still release. Everything else — `chore:`,
# `docs:`, `ci:`, `build:`, `refactor:`, `test:`, `style:` — no longer does.
#
# Two consequences worth knowing before you write a commit:
#   1. A BREAKING CHANGE: footer on a non-matching type (e.g. `refactor:`)
#      will NOT trigger a release. Use `feat!:` / `fix!:` for anything that
#      needs to ship, so the break rides a releasable type.
#   2. Dependency bumps land as `chore(deps)`/`build(deps)` and no longer
#      release on their own. A dependency fix that must reach crates.io needs
#      a `fix:` commit (or a manual release), not just the bump.
#
# Lockstep is preserved: per release-plz's documented version_group behaviour,
# one matching commit in any member releases the whole group, so the 14 crates
# still move together.
release_commits = "^(feat|fix|perf)"


# Create a GitHub Release (tag + notes) for each published version.
git_release_enable = true

# Lockstep versioning: the acdp crates are one library split across
# crates that must be consumed as a coherent set (shared types flow
# across crate boundaries via acdp-primitives). Independent per-crate
# versions let a fresh resolver mix release generations and mismatch
# acdp-primitives majors. Putting every member in one `version_group`
# makes release-plz assign them all the same next version — bumping the
# whole family together (even unchanged crates). The version itself lives
# once in [workspace.package] and each member inherits it. semver_check
# above still guards real API breaks.
[[package]]
name = "acdp"
version_group = "acdp"
[[package]]
name = "acdp-primitives"
version_group = "acdp"
[[package]]
name = "acdp-jcs"
version_group = "acdp"
[[package]]
name = "acdp-safe-http"
version_group = "acdp"
[[package]]
name = "acdp-did"
version_group = "acdp"
[[package]]
name = "acdp-crypto"
version_group = "acdp"
[[package]]
name = "acdp-types"
version_group = "acdp"
[[package]]
name = "acdp-validation"
version_group = "acdp"
[[package]]
name = "acdp-verify"
version_group = "acdp"
[[package]]
name = "acdp-chain"
version_group = "acdp"
[[package]]
name = "acdp-producer"
version_group = "acdp"
[[package]]
name = "acdp-client"
version_group = "acdp"
[[package]]
name = "acdp-server"
version_group = "acdp"
[[package]]
name = "acdp-cli"
version_group = "acdp"
