Source: crates.io tarball sha256 7d5515a3834141de9eafb9717ad39eea8247b5674e6066c404e8c4b365d2a29e == Cargo.lock checksum.
unsafe: 0 sites, including both exported macros (full-source grep, comment lines excluded; the grep is the evidence). #![forbid(unsafe_code)] at src/lib.rs:7 is only a corroborating hint (cargo builds registry deps with --cap-lints allow). The crate's own comment says unsafe "should go in cmov": all predication is delegated to cmov 0.5 (Cmov::cmovnz, CmovEq::cmoveq), whose unsafe/asm is a separate Tier B crate, still exempted.
