[[audits.ed25519-dalek]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
delta = "2.2.0 -> 3.0.0"
notes = """
Scope: delta 2.2.0 -> 3.0.0 (17 files, +770/-264; 1034 changed / 3552 src lines = 0.29, so delta per the #322 method rule). Base 2.2.0 spot-checked: forbid(unsafe_code) outside tests, no build.rs, Drop zeroizes secrets.
Source: crates.io tarball sha256 6ebaa1a2bf1290ab3bfe5a7b771d050ebffab2711c19a81691c683a5144a25de == Cargo.lock checksum.
unsafe: 0 sites in every feature configuration. forbid(unsafe_code) is now conditional: src/lib.rs:246 #![cfg_attr(not(any(test, feature = "batch")), forbid(unsafe_code))]; ACDP does not enable batch (features: default, fast, rand_core, signature, zeroize in the root workspace and the py/node/wasm bindings), so the lint is active in every ACDP build.
asm/SIMD: none (sha2/asm feature removed).
build.rs / proc-macro: none.
Powerful imports: none (#![no_std]; std only under cfg(test); the std feature was removed).
Changes read: multipart Signer/Verifier forwarding (single-slice hash input byte-identical), closure-based DigestSigner/DigestVerifier, KeySizeUser/TryKeyInit/Generate impls, rand_core 0.10 CryptoRng in generate, pkcs8 SignatureAlgorithmIdentifier, vendored Merlin transcript over strobe-rs for batch. verify (used by ACDP) is unchanged: canonical-s check (from_canonical_bytes; legacy_compatibility off), R compared by encoding; it accepts small-order keys/R, which verify_strict rejects (worksheet finding E-1, ACDP-side follow-up, not a vet concern). SigningKey/ExpandedSecretKey Drop zeroize unchanged, all on initialized [u8;32]/Scalar.
New deps: curve25519-dalek 4 -> 5.0.0, ed25519 2.2 -> 3, sha2 0.10 -> 0.11, signature 2 -> 3, rand_core 0.6.4 -> 0.10; merlin removed; keccak 0.2 and strobe-rs 0.13 added (optional, batch only, not in ACDP's graph). Tier B ed25519/rand_core/digest still exempted.
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour, side-channel resistance. Behavioural evidence only: ACDP sig-001 golden vector pins Ed25519 signature bytes.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/ed25519-dalek-3.0.0.md (issue #322 Phase 3 PR)."""

