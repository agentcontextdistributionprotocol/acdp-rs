[[audits.curve25519-dalek-derive]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
version = "0.1.1"
notes = """
Scope: full audit of 0.1.1 (no prior audit of curve25519-dalek-derive). src/lib.rs (466 lines, the whole crate), README.md, tests/tests.rs, Cargo.toml and .orig were read in full. Also read: curve25519-dalek 5.0.0's target condition, build.rs backend selection, src/backend.rs dispatch, and backend visibility.
Source: crates.io tarball sha256 f46882e17999c6cc590af592290432be3bce0428cb0d5f8b6715e4dc7b383eb3 == Cargo.lock checksum (the root and the py/node/wasm binding lockfiles are identical).
unsafe: 0 executed by this crate. The 5 grep hits (src/lib.rs:428, :436, :446, :459, :460) are all inside quote! output templates, i.e. generated code (full-source grep, comment lines excluded; there is no forbid/deny attribute and lints are capped by --cap-lints for registry deps, so the grep is the evidence). Generated code: #[unsafe_target_feature("F")] turns fn f into a safe #[inline(always)] wrapper that defines #[target_feature(enable = "F")] unsafe fn _impl_f with the original body and calls it in unsafe {}. On impls it uses a local trait __Impl_f__ for self methods, and on mods it applies the same rewrite to each fn/impl. unsafe_target_feature_specialize clones a mod per feature set (m_<features>), with #[for_target_feature] item filtering and an optional #[cfg]. Already-unsafe fns only gain #[target_feature]. Types and generics are kept. The user's "safe" body is spliced unchanged into the generated unsafe fn (src/lib.rs:436, :459), so it becomes an unsafe context. curve25519-dalek 5.0.0 is edition 2024, where unsafe_op_in_unsafe_fn only warns and --cap-lints silences it, so unsafe operations (e.g. register-only core::arch intrinsics; see packed_simd.rs:6-9) compile in those bodies with no unsafe token, and a full-source grep of curve25519-dalek undercounts its unsafe operations.
Soundness: calling a target_feature fn on a CPU without the feature is UB, and the wrapper checks nothing, so the macro moves that precondition onto the user, as its README documents ("moves the unsafe ... into the macro name"). The sole user in ACDP's graph, curve25519-dalek 5.0.0, discharges it: every annotated fn is in backend::vector, backend is pub(crate), and every entry goes through get_selected_backend() (src/backend.rs:55-75), which selects avx512/avx2 only after cpufeatures detection and otherwise falls back to serial. This matches the curve25519-dalek 4.1.3 -> 5.0.0 audit. Test-only caveat: tests/tests.rs:146-147 calls an avx2 wrapper with no check (crate tests on x86 only; never in ACDP builds).
asm/SIMD: none emitted except #[target_feature] attributes.
build.rs / proc-macro: proc-macro = true; no build.rs. Build-time behaviour is a pure syn parse, AST rewrite and quote!, with errors via compile_error!. No fs, env, process or network access.
Powerful imports: none (only the README include_str!).
New deps: proc-macro2 1.0.66, quote 1.0.31, syn 2.0.27 (full). It is compiled only where curve25519-dalek 5.0.0 targets x86_64 without a forced fiat/serial backend: present on all x86_64 targets (root --target all incl. x86_64 Linux/macOS/Windows; the py/node releases ship x86_64-apple-darwin and x86_64-unknown-linux-gnu), absent on host aarch64 and on acdp-wasm wasm32 (serial u32 backend).
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour, side-channel resistance, cpufeatures detection correctness (a separate Tier B crate), or the soundness of any other user of this macro.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/curve25519-dalek-derive-0.1.1.md (issue #339 Tier B batch B5 PR)."""

[[audits.der]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
version = "0.8.1"
notes = """
Scope: full audit of 0.8.1 (no prior audit of der). src/ is 14534 lines in 56 .rs files. What was read: the non-test code of all 56 src files, in full, except ///-and-//! doc-comment lines. That includes the code behind features ACDP leaves off (real, ber, pem, heapless, arbitrary, time). Doc comments (including the lib.rs crate docs) were skimmed. In-file #[cfg(test)] modules were read for most files and grep-checked (no unsafe/fs/include) for the rest, and a script confirmed that no non-test code follows them. tests/*.rs were grep-checked (test-only). Cargo.toml and .orig were read.
Source: crates.io tarball sha256 a69dedd701da44b0536442edf09c81a64b0ab97a7a4a5e3d1971f00027cbc63d == Cargo.lock checksum (the root and the py/node/wasm binding lockfiles are identical).
unsafe: 4 code lines (full-source grep, comment lines excluded; the #![deny(unsafe_code)] at lib.rs:8 and the per-site #[allow] are capped by --cap-lints for registry deps, so the grep is the evidence). All four are #[repr(transparent)] DST newtype reference casts: src/bytes.rs:29 (&[u8] -> &BytesRef([u8])), src/string.rs:26 (&str -> &StringRef(str)), src/asn1/octet_string.rs:37 (&BytesRef -> &OctetStringRef { inner: BytesRef }) and src/asn1/sequence.rs:55 (&BytesRef -> &SequenceRef { body: BytesRef }). In each, the layout and the slice-length metadata are identical, the source is a live shared reference (a real &str for StringRef, so UTF-8 holds), the result is read-only, and the signature ties the lifetime. The only check new_unchecked skips is len <= u32::MAX, a library invariant used only by len()'s debug_assert plus `as u32`, so a violation would give a wrong Length and not UB. Every unchecked caller passes an already-bounded slice anyway.
asm/SIMD: none.
build.rs / proc-macro: none (build = false); not a proc-macro. der_derive (derive feature) is off.
Powerful imports: filesystem only through explicit std APIs on caller-named paths: Document::read_der_file/write_der_file and SecretDocument::read_der_file/write_der_file (src/document.rs:11, :119-131, :300-312; write_secret_file uses mode 0o600). The pem variants are off. Neither ACDP nor der's dependents on ACDP's path (ecdsa, sec1, spki, pkcs8) call these; sec1/spki/pkcs8 only wrap them in their own opt-in *_file APIs, which ACDP does not call. scripts/vet-facts.sh misses this brace import (use std::{fs, path::Path}). io::Write blanket Writer, no clock reads, no net/process/env, no include_bytes!.
Discretion: D-1. ValueOrd for ContextSpecific/Application/Private (src/asn1/internal_macros.rs:276-286) never terminates: Implicit calls self.value_cmp, and Explicit with equal headers bounces through DerOrd. Confirmed: a debug build hits a stack overflow and aborts, and a release build hangs (Implicit) or overflows (Explicit).
Discretion: D-2. impl TryFrom<AnyRef> for bool (src/asn1/boolean.rs:49-55) calls any.try_into(), which recurses through the blanket TryInto. Confirmed: a debug build overflows the stack, and a release build hangs.
Neither D-1 nor D-2 is memory unsafety (safe code; stack overflow aborts at the guard page on native, and in acdp-wasm on wasm32, which has no guard page, it ends in a wasm trap; it is still unreachable there). Both are unreachable in every ACDP artifact: ACDP calls der nowhere and parses no DER (P-256 via from_sec1_bytes, signatures via from_slice), and ecdsa 0.17.0 / sec1 0.8.1 / spki 0.8.0 / pkcs8 0.11.0 never compare context-specific values or call bool::try_from(AnyRef) (grep). Recommend an upstream report; not filed by this audit.
Empirical: 300k random and semi-structured inputs through 25 decoders (including &OctetStringRef and &SequenceRef, which exercise the casts) with no panic (release build with debug assertions on). Miri was not run. Nesting is bounded at 64 (reader/position.rs:20).
New deps: optional arbitrary, bytes, const-oid, der_derive, derive_arbitrary, flagset, heapless, pem-rfc7468, time, zeroize. ACDP features: alloc, oid, std, zeroize (every build). Reached via ecdsa 0.17.0, sec1 0.8.1, spki 0.8.0.
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour, side-channel resistance, or DER encoding/canonicality correctness.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/der-0.8.1.md (issue #339 Tier B batch B5 PR)."""

