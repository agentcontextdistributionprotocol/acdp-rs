New deps: der 0.8, digest 0.11, elliptic-curve 0.14, rfc6979 0.6, serdect 0.4, sha2 0.11 (optional), signature 3, spki 0.8; added zeroize 1.5. ACDP features: algorithm, alloc, der, digest, spki, std (root and py/node/wasm bindings identical). Tier B rfc6979, hmac, der, spki, digest still exempted.
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour, side-channel resistance.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/ecdsa-0.17.0.md (issue #322 Phase 4 PR)."""

[[audits.ed25519]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
version = "3.0.0"
notes = """
Scope: full audit of 3.0.0 (no prior audit, ours or imported; 947 src lines, every src file read, plus tests/ for imports and fixtures).
Source: crates.io tarball sha256 29fcf32e6c73d1079f83ab4d782de2d81620346a5f38c6237a86a22f8368980a == Cargo.lock checksum.
unsafe: 0 sites (full-source grep; forbid is capped by --cap-lints for registry deps, so the grep is the evidence); #![forbid(unsafe_code)] is at src/lib.rs:6.
asm/SIMD: none.
build.rs / proc-macro: none (optional zerocopy derives are off; on repr(C)/repr(transparent) u8 arrays with no padding they would be layout-sound).
Powerful imports: none (#![no_std]; alloc only behind `alloc`; include_str! README for docs only).
Discretion: binary test fixtures tests/examples/{pkcs8-v1,pkcs8-v2,pubkey}.der (48/116/44 bytes), each byte-identical to the base64 body of its sibling .pem; read only by tests/pkcs8.rs via include_bytes!; not compiled into any non-test build.
Behaviour: Signature is an unvalidated 64-byte R||s container (from_slice length check, hex Display/FromStr with mixed-case rejection, optional serde/zeroize); optional RFC 8410 PKCS#8/SPKI KeypairBytes/PublicKeyBytes with OID and nested OCTET STRING checks. ACDP uses only the Signature container (from_slice / to_bytes / from_components): from_slice on verify (crates/acdp-crypto/src/verify.rs:38), to_bytes on sign (crates/acdp-crypto/src/sign.rs:67-68,104-105), and ed25519-dalek's own from_components/to_bytes conversions (ed25519-dalek-3.0.0/src/signature.rs:167,173); all verification checks are in ed25519-dalek/curve25519-dalek (audited; safe-to-deploy only; correctness not claimed). Hygiene note (feature-gated, off): without `zeroize`, KeypairBytes Drop does not clear the secret, and to_pkcs8_der skips its zeroize on early-return errors.
New deps: signature 3 (audited 3.0.0); optional pkcs8 0.11, serdect 0.4, zeroize 1, zerocopy 0.8. ACDP features: none (ed25519-dalek uses default-features = false and ACDP leaves ed25519-dalek/alloc off; root and py/node/wasm bindings identical).
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour, side-channel resistance.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/ed25519-3.0.0.md (https://github.com/agentcontextdistributionprotocol/acdp-rs/pull/355, issue #339 batch B1)."""

