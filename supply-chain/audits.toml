[[audits.crypto-common]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
version = "0.2.2"
notes = """
Scope: full audit of 0.2.2 (no prior audit, ours or imported; 853 src lines, every file read).
Source: crates.io tarball sha256 ce6e4c961d6cd6c9a86db418387425e8bdeaf05b3c8bc1411e6dca4c252f1453 == Cargo.lock checksum.
unsafe: 0 sites (full-source grep; forbid is capped by --cap-lints for registry deps, so the grep is the evidence); #![forbid(unsafe_code)] is at src/lib.rs:8.
asm/SIMD: none.
build.rs / proc-macro: none.
Powerful imports: none directly (#![no_std]). OS entropy by delegation: with the `getrandom` feature (on in ACDP via elliptic-curve) Generate::try_generate/generate read getrandom::SysRng (src/generate.rs:28-45; generate panics on OS RNG failure, documented). Explicit key-generation API; the syscall lives in getrandom (Tier B, still exempted). ACDP passes its own SysRng to generate_from_rng and does not call these.
Behaviour: size/constructor traits (KeyInit, KeyIvInit, InnerIvInit, ...) with length-checked slice constructors, Generate impls, and hazmat SerializableState. Observation CC-1 (not a vet concern): the [u128; N] SerializableState impls use an 8-byte element size (src/hazmat.rs:162-168), so serialize/deserialize always panic (safe copy_from_slice / unwrap, never UB); unused in ACDP's graph; fixed upstream in RustCrypto/traits#2471 (unreleased).
New deps: hybrid-array 0.4.7; optional getrandom 0.4 (sys_rng), rand_core 0.10. ACDP features: getrandom, rand_core (root and py/node/wasm bindings identical). Tier B hybrid-array, getrandom, rand_core still exempted.
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour, side-channel resistance.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/crypto-common-0.2.2.md (https://github.com/agentcontextdistributionprotocol/acdp-rs/pull/355, issue #339 batch B1)."""

