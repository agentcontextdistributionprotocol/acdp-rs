
# cargo-vet audits file

[[audits.base16ct]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
version = "1.0.0"
notes = """
Scope: full audit of 1.0.0 (no prior audit of base16ct). src/ is 381 lines. All 6 src files, Cargo.toml and .orig were read in full. tests/lib.rs and benches/mod.rs were inspected (test-only).
Source: crates.io tarball sha256 fd307490d624467aa6f74b0eabb77633d1f758a7b25f12bceb0b22e08d9726f6 == Cargo.lock checksum (the root and the py/node/wasm binding lockfiles are identical).
unsafe: 4 code lines, all from_utf8_unchecked on bytes the crate wrote itself (full-source grep, comment lines excluded; there is no forbid/deny attribute, and lints are capped by --cap-lints for registry deps, so the grep is the evidence).
- src/lower.rs:35 and src/upper.rs:35 (encode_str). encode first takes dst.get_mut(..2n), which is checked and returns Err if dst is short. The zip of the n source bytes with chunks_exact_mut(2) writes every output byte, so caller-supplied junk in dst is fully overwritten. encode_nibble receives only src >> 4 or src & 0x0f (0..=15) and returns 0x30-0x39 or 0x61-0x66 (0x41-0x46 for upper). The output is all ASCII.
- src/lower.rs:49 and src/upper.rs:49 (encode_string). The input is a zeroed Vec of the exact length, fully written by encode as above.
- len*2 cannot overflow, because a [u8] holds at most isize::MAX bytes.
- Empirical check (release build with debug assertions on): every 2-byte input was encoded into 0x00- and 0xFF-prefilled buffers and gave identical output, matching format!'s hex. 20k random inputs were compared to a reference and round-tripped.
asm/SIMD: none.
build.rs / proc-macro: none; not a proc-macro.
Powerful imports: none. #![no_std], alloc only behind a feature, no include_*/env!/std::{fs,net,process,env}.
New deps: none. ACDP features: alloc (every build). Reached via sec1 0.8.1 (HexDisplay; FromStr for EncodedPoint) and elliptic-curve 0.14.1. ACDP calls it nowhere; its own hex is the hex crate.
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour (the crate advertises constant-time encoding; that is not claimed or verified), side-channel resistance.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/base16ct-1.0.0.md (issue #339 Tier B batch B5 PR)."""

[[audits.base64ct]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
version = "1.8.3"
notes = """
Scope: full audit of 1.8.3 (no prior audit of base64ct). src/ is 2092 lines. All 14 src files, Cargo.toml and .orig were read in full. tests/*.rs were inspected (test-only).
Source: crates.io tarball sha256 2af50177e190e07a26ab74f8b1efbfe2ef87da2116221318cb1c2e82baf7de06 == Cargo.lock checksum (the root and the py/node/wasm binding lockfiles are identical).
unsafe: 4 code lines, all in src/encoding.rs inside impl<T: Alphabet> Encoding for T (full-source grep, comment lines excluded; lib.rs only warns on unsafe_code, and lints are capped by --cap-lints for registry deps, so the grep is the evidence). Alphabet is a pub trait in the private mod alphabet, so it is sealed: only the 8 in-crate alphabets reach this code.
- :125 decode_in_place loop. With chunk < len/4, the in-bounds bounds are 4c+4 <= len and 3c+3 <= len. p3 and p4 come from as_mut_ptr/as_ptr, which std documents as not materializing references, so they may be mixed. The shared &*p4 ends before the overlapping write *p3. The data is u8, so there is no alignment or validity requirement.
- :155 decode_in_place tail. dst_rem_len = floor(3l/4) <= 2 < tmp_out.len(), and dlen = 3k + floor(3l/4) <= 4k + l = buf.len(). So copy_nonoverlapping (from a stack array) and get_unchecked(..dlen) stay in bounds.
- :231 encode, from_utf8_unchecked on a caller-supplied buffer. elen comes from checked_mul and is checked <= dst.len(). Every byte is written: the full chunks by the zip (&mut iterators, source pulled first), the padded remainder by encode_3bytes plus the PAD mask, and the unpadded remainder copied from tmp_out. encode_6bits only receives 0..=63.
- :245 encode_string. The input is a zeroed Vec of the exact length, fully written as above.
- Empirical check (release build with debug assertions on), all 8 alphabets: every 1-, 2- and 3-byte input (2^24) was encoded into 0x00- and 0xFF-prefilled buffers. The outputs were identical, ASCII/UTF-8, and round-tripped through decode and decode_in_place. Also 20k random inputs, and 200k garbage decodes with no panic. Miri was not run.
asm/SIMD: none.
build.rs / proc-macro: none; not a proc-macro.
Powerful imports: none. #![no_std]. std only adds in-memory io::Read/io::Write adaptors and From<Error> for io::Error. No include_bytes!, env!, std::{fs,net,process,env}.
New deps: none (dev: base64, proptest). ACDP features: not compiled in any ACDP build. It is lock-only (its only dependent is spki's optional base64 feature, off), and cargo tree -i is empty for the root, acdp --no-default-features (host/wasm32) and the py/node/wasm bindings.
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour (the crate advertises constant-time encoding/decoding; that is not claimed or verified), side-channel resistance.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/base64ct-1.8.3.md (issue #339 Tier B batch B5 PR)."""

[[audits.block-buffer]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
version = "0.12.1"
notes = """
Scope: full audit of 0.12.1 (no prior audit; 756 src lines in src/lib.rs, src/sealed.rs, src/read.rs, all read line by line; tests/mod.rs grep-scanned).
Source: crates.io tarball sha256 d2f6c7dbe95a6ed67ad9f18e57daf93a2f034c524b99fd2b76d18fdfeb6660aa == Cargo.lock checksum.
unsafe: 21 code lines, all reasoned about (worksheet table). Invariants: BS in U1..=U255; Eager keeps the cursor in the buffer's last byte with pos < BS, Lazy keeps it in a u8 field with pos <= BS; bytes 0..pos initialized; ReadBuffer keeps 1 <= buffer[0] <= BS. Every unchecked write/read (copy_nonoverlapping, ptr::read/write of the cursor byte, from_raw_parts, assume_init_ref/mut, unreachable_unchecked in get_pos) is guarded by K::invariant checks, split_at/split_blocks lengths or asserts; the two paths that temporarily break the invariant (digest_blocks with pos != 0, digest_pad) restore it through a ResetGuard Drop, including on unwind from the caller's compress closure, which never sees the buffer. Clone via ptr::read is sound because no field owns a resource (observation BB-1: its SAFETY comment wrongly says there is no Drop impl). No forbid(unsafe_code); the grep is the evidence.
asm/SIMD: none. No cfg(target_*): identical code on x86_64, aarch64, wasm32 and 32-bit targets.
build.rs / proc-macro: none.
Powerful imports: none (#![no_std]).
New deps: hybrid-array 0.4 (locked 0.4.14); optional zeroize (feature off in ACDP root and all bindings, so the zeroize impls are not compiled). Dev-only: hex-literal. Reached via digest 0.11.3 (sha2, hmac).
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour, side-channel resistance.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/block-buffer-0.12.1.md (issue #339 Tier B batch B6 PR)."""

[[audits.cmov]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
version = "0.5.4"
notes = """
Scope: full audit of 0.5.4 (no prior audit; 1702 src lines, all read line by line including the x86, aarch64 and soft backends; tests/ grep-scanned).
Source: crates.io tarball sha256 0c9ea0ac24bc397ab3c98583a3c9ba74fa56b09a4449bbe172b9b1ddb016027a == Cargo.lock checksum.
unsafe: 25 code lines, all reasoned about (worksheet table). NonZero::new_unchecked (src/lib.rs:280) and the Ordering write (src/lib.rs:326) are sound because every integer cmov leaves exactly one of its two operands (ISA semantics of CMOVcc/CSEL; masksel with a 0/MAX mask in soft). The slice reinterpretations (src/slice.rs:170-171, 270-271; cast_slice/_mut) have const-asserted equal size/align, and each element's final value is a whole element taken from one operand. The remainder path's word_to_slice (src/slice.rs:399-403) first writes 0 and then ORs bytes in, so through the integer view a NonZero* remainder element briefly holds 0; that is not UB because nothing reads it at the NonZero/Ordering type before every element is valid again, so NonZero*/Ordering validity holds whenever the original slice is used. Vendored as_chunks helpers (src/slice.rs:420-491) split at len/N*N with N != 0 asserted.
asm/SIMD: 7 asm! sites. x86 (src/backends/x86.rs:16, :33; x86/x86_64 artifacts): test+cmovcc / xor+cmovcc with pure, nomem, nostack, no preserves_flags (flags clobber declared), register widths matching the type. aarch64 (src/backends/aarch64.rs:8, :27; aarch64 artifacts): tst/eor/cmp + csel with pure, nomem, nostack, flags clobber declared, scratch is out (not lateout), low-byte/halfword masking for narrow inputs. soft.rs:151/:167/:189 are arm/riscv32/riscv64 only, compiled in no ACDP artifact; wasm32 (bindings/acdp-wasm) uses the pure-Rust soft path with no asm. Operand and option declarations are consistent with the instructions; the claim stops there.
build.rs / proc-macro: none.
Powerful imports: none (#![no_std]; include_str! for README docs).
New deps: none (dev-only proptest). No features. Reached via ctutils 0.4.2 only.
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour (this is a constant-time crate; neither its constant-time property nor branch-freedom of the generated code, nor that the asm achieves its constant-time intent, is claimed), side-channel resistance.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/cmov-0.5.4.md (issue #339 Tier B batch B6 PR)."""

[[audits.const-oid]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
version = "0.10.2"
notes = """
Scope: full audit of 0.10.2 (no prior audit of const-oid). src/ is 6839 lines. Every hand-written file was read in full: lib.rs 399, arcs 180, buffer 52, checked 31, encoder 170, error 89, parser 131, traits 25, db.rs 147, plus Cargo.toml and .orig. src/db/generated.rs (5615 lines, compiled only with the db feature, which is off in every ACDP build) was checked mechanically rather than line by line: it holds only pub mod headers, 1492 pub const ... = ObjectIdentifier::new_unwrap("<digits>") items and the DB tuple table. tests/*.rs were inspected (test-only).
Source: crates.io tarball sha256 a6ef517f0926dd24a1582492c791b6a4818a4d94e789a334894aa15b0d12f55c == Cargo.lock checksum (the root and the py/node/wasm binding lockfiles are identical).
unsafe: 1 code line (full-source grep, comment lines excluded; the #![deny(unsafe_code)] at lib.rs:9 and the #[allow] at :319 are capped by --cap-lints for registry deps, so the grep is the evidence). src/lib.rs:320, in ObjectIdentifierRef::from_bytes_unchecked (pub(crate)), casts &[u8] to &ObjectIdentifierRef, which is #[repr(transparent)] { ber: [u8] }. The layout and the slice-length metadata are identical, the reference is shared and read-only, and the signature ties the lifetime to the input. BER well-formedness is a library invariant: from_bytes validates before the cast, and as_oid_ref passes internally built or validated buffers. A violation could only reach the expect("OID malformed") in Arcs::next (a panic, not UB). No other unsafe exists.
asm/SIMD: none.
build.rs / proc-macro: none; not a proc-macro.
Powerful imports: none. #![no_std], only the README include_str!, no env!/std::{fs,net,process,env}.
Behaviour: the panics are by design (new_unwrap/Error::panic for const construction) or unreachable for crate-built buffers. Hygiene only: Encoder::finish stores the cursor as u8, which would truncate for MAX_SIZE > 255. ACDP uses the default 39, and the result is a wrong length via checked split_at, not UB.
New deps: optional arbitrary (off). ACDP features: none (db and arbitrary off). Reached via der 0.8.1 (oid) and digest 0.11.3 (oid).
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour, side-channel resistance.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/const-oid-0.10.2.md (issue #339 Tier B batch B5 PR)."""

