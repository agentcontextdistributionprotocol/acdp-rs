[[audits.zeroize_derive]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
version = "1.5.0"
notes = """
Scope: full audit of 1.5.0 (no prior audit, ours or imported; src/lib.rs is the only source file, 870 lines incl. the cfg(test) module, read in full).
Source: crates.io tarball sha256 3c50655cbb0fe3fc43170059e702f1ce5e19b84cec58dc87b037a09935c2f328 == Cargo.lock checksum.
unsafe: 0 sites (full-source grep; forbid is capped by --cap-lints for registry deps, so the grep is the evidence); #![forbid(unsafe_code)] is at src/lib.rs:4. The generated code contains no unsafe either (every quote! block read).
asm/SIMD: none.
build.rs / proc-macro: no build.rs. proc-macro = true: derives Zeroize and ZeroizeOnDrop. Pure token-to-token codegen with syn/quote: reads only the input item and its #[zeroize(drop|bound|skip)] attributes, emits Zeroize/Drop/ZeroizeOnDrop impls that call zeroize's public traits; no fs/net/process/env, no env!/include_*!, no tracked access, no static state; malformed input fails via panic!/assert! (compile errors).
Powerful imports: none.
ACDP use: zeroize `derive` feature (acdp-crypto); one #[derive(ZeroizeOnDrop)] on SigningKey(ed25519_dalek::SigningKey) (crates/acdp-crypto/src/sign.rs:26), whose generated Drop is a no-op because ed25519_dalek::SigningKey implements ZeroizeOnDrop but not Zeroize (ed25519-dalek-3.0.0/src/signing.rs:719-726); a field implementing Zeroize (with or without ZeroizeOnDrop) instead takes the AssertZeroize path and has zeroize() called. Erasure semantics belong to zeroize 1.9.0, still exempt under DECISIONS 322-zeroize; this audit does not cover zeroize.
New deps: proc-macro2 1, quote 1, syn 2 (full, extra-traits, visit); host-only. ACDP features: default (none defined); root and py/node/wasm bindings identical.
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: cryptographic correctness, constant-time behaviour, side-channel resistance, or that zeroization clears memory.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/zeroize_derive-1.5.0.md (https://github.com/agentcontextdistributionprotocol/acdp-rs/pull/355, issue #339 batch B1)."""
