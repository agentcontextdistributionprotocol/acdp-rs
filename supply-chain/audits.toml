Verification path: Signature::from_slice requires 64 bytes and r, s in [1, n-1]; Verifier::verify hashes with C::Digest (SHA-256 for P-256) and runs hazmat::verify_prehashed; high-S is rejected only when C::NORMALIZE_S (false for P-256), so (r, n-s) also verifies (ACDP-relevant malleability finding P-1, p256 worksheet; not a vet concern). Signing is RFC 6979 (rfc6979 0.6) with non-vartime k*G.
