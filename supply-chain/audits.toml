[[audits.webpki-roots]]
who = "Ajit Koti <ajitkoti@zer07labs.com>"
criteria = "safe-to-deploy"
version = "1.0.9"
notes = """
Scope: full audit of 1.0.9 (no prior audit of webpki-roots; src/lib.rs is the only source file, 4603 lines: a 37-line header, then the declaration at src/lib.rs:38 of one static table). The header was read in full. The table was checked mechanically and exhaustively: every one of the 4565 lines after the declaration (39-4603) matches one of the generator's line shapes (comment block, TrustAnchor {, subject, subject_public_key_info, name_constraints, }, blank, ];), giving 121 TrustAnchor entries. For all 121 entries the PEM certificate in the entry's comment was decoded; its SHA-256 equals the commented fingerprint, and the subject and subject_public_key_info byte strings equal that certificate's subject Name and SubjectPublicKeyInfo contents. Every certificate is a CA (basicConstraints cA=true). One entry (TUBITAK Kamu SM SSL Kok Sertifikasi - Surum 1, src/lib.rs:1258) carries name_constraints = permittedSubtrees dNSName ".tr", a restriction.
Source: crates.io tarball sha256 7dcd9d09a39985f5344844e66b0c530a33843579125f23e21e9f0f220850f22a == Cargo.lock checksum.
Data provenance: src/lib.rs is generated by tests/codegen.rs from the CCADB Mozilla IncludedCACertificateReportPEMCSV (via the upstream-only webpki-ccadb crate, not in the tarball); the header equals the generator's HEADER constant byte for byte. Regeneration happens upstream by running that test, which fetches CCADB over the network and rewrites src/lib.rs; it is test-only and not run in ACDP builds.
unsafe: 0 sites (full-source grep; the grep is the evidence). #![forbid(unsafe_code, unstable_features)] at src/lib.rs:26 is only a corroborating hint (capped by --cap-lints allow for registry deps).
asm/SIMD: none.
build.rs / proc-macro: none (build = false; not a proc-macro). No macros exported.
Powerful imports: none in src/. #![no_std]; the crate is one pub const TLS_SERVER_ROOTS: &[TrustAnchor<'static>] built with the const Der::from_slice from rustls-pki-types. No code runs at runtime beyond reading that static.
Discretion: tests/codegen.rs (network fetch and fs::write of src/lib.rs) and tests/verify.rs are integration tests only; tests/data/tubitak/*.der are three test-only DER certificates. None is compiled into a non-test build.
New deps: rustls-pki-types 1.8 (default-features off). Dev-only deps (incl. aws-lc-rs) are not part of ACDP's graph.
Role: reqwest 0.12's rustls-tls feature (crates/acdp-client/Cargo.toml:41, crates/acdp-did/Cargo.toml:37, crates/acdp-safe-http/Cargo.toml:29, crates/acdp-primitives/Cargo.toml:28) enables rustls-tls-webpki-roots, so this table is the default trust-anchor set for ACDP's HTTPS clients; the optional caller-supplied roots (crates/acdp-did/src/web.rs:108, crates/acdp-client/src/registry.rs:865) are added with add_root_certificate, not substituted. This is a trust boundary. In the py/node bindings it is locked but not compiled (acdp built with default-features = false; absent from their cargo tree); wasm does not lock it.
Advisories: cargo deny check advisories clean on 2026-10-04.
Not claimed: that the root set is correct, complete, current, or appropriate for ACDP; certificate-validation correctness (rustls-webpki); cryptographic correctness; constant-time behaviour; side-channel resistance. This audit claims only that the crate's code is safe to deploy and that the table is what its comments say it is.
Method: Reviewed with Claude (Opus) assistance; worksheet in supply-chain/worksheets/webpki-roots-1.0.9.md (issue #339 Tier B batch B4 PR)."""

